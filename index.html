<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coragem · Estudo em Família</title>
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#faf8f5;--card:#fff;--ink:#1f2328;--muted:#6b7280;--line:#e7e2dc;
  --acc:#c2410c;--acc2:#ea580c;--accsoft:#fff1e8;--field:#fdfcfb;--ok:#15803d;--bad:#dc2626;
  --paper:#fffdf9;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
}
:root[data-theme="dark"]{
  --bg:#14120f;--card:#1e1b17;--ink:#ece7e1;--muted:#a39b91;--line:#332d27;
  --acc:#fb923c;--acc2:#f97316;--accsoft:#2c1d12;--field:#191612;--ok:#4ade80;--bad:#f87171;
  --paper:#1a1714;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* barra */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;height:56px;position:relative}
.bar h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px}
.ib.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
@media(max-width:420px){.sync span:last-child{display:none}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.busy{background:var(--acc2)}
.edbanner{background:var(--acc);color:#fff;font-size:13px;text-align:center;padding:5px 10px;font-weight:600}

/* home */
.hero{display:flex;gap:20px;align-items:center;padding:24px 0 8px}
.hero img{width:110px;border-radius:8px;box-shadow:var(--shadow);flex:none}
.hero h2{margin:0 0 4px;font-size:24px;line-height:1.2}
.hero p{margin:0;color:var(--muted);font-size:14px}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc2);border-radius:9px;transition:width .4s}
.search{width:100%;margin:16px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.sech{margin:26px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.sech small{display:block;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;color:inherit;box-shadow:var(--shadow);display:flex;flex-direction:column}
.lc .th{aspect-ratio:16/9;background:var(--line) center/cover;position:relative}
.lc .num{position:absolute;left:10px;top:10px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:2px 8px}
.lc .done{position:absolute;right:10px;top:10px;background:var(--ok);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px}
.lc .ico{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.lc .ico b{background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px;font-weight:600}
.lc .tx{padding:10px 12px 12px}
.lc .nm{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.lc .tt{font-size:15px;font-weight:600;line-height:1.3;margin-top:2px}
.lc .pp{height:4px;background:var(--line);margin-top:auto}
.lc .pp i{display:block;height:100%;background:var(--acc2)}

/* lição: capa + abas */
.cover{position:relative;margin:0 -16px;aspect-ratio:16/9;max-height:62vh;background:#000 center/cover;display:flex;align-items:flex-end}
.cover.sm{aspect-ratio:auto;height:150px}
@media(min-width:852px){.cover{margin:16px 0 0;border-radius:18px;overflow:hidden}}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.1) 60%,transparent)}
.cover .ct{position:relative;z-index:1;color:#fff;padding:20px}
.cover .ctx{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fdba74}
.cover h2{margin:4px 0 0;font-size:clamp(24px,5vw,34px);line-height:1.15;font-family:var(--serif)}
.cover.sm h2{font-size:22px}
.tabs{position:sticky;top:56px;z-index:20;background:var(--bg);display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.tabs a b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;margin-right:4px}
.tabs a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs a.on b{background:#fff;color:var(--acc)}

.leit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 6px}
.leit span{font-size:13px;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--accsoft);color:var(--acc);text-decoration:none;font-weight:600;font-size:14px}
.pc{margin:18px 0;background:var(--accsoft);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:18px;padding:18px}
.pc .lb{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.pc .q{font-size:20px;font-weight:700;line-height:1.3;margin:6px 0 12px}
.sec{margin-top:30px}
.sec>h3{margin:0 0 12px;font-size:20px;padding-top:10px;border-top:3px solid var(--acc);color:var(--acc)}
.qq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.qh a,.refs a{text-decoration:none;font-weight:600;border-bottom:1px dotted currentColor}
.tag{display:inline-block;background:var(--acc2);color:#fff;border-radius:6px;padding:0 7px;font-size:13px;margin-left:4px;font-family:system-ui}
figure{margin:14px 0 4px;position:relative}
figure img{width:100%;border-radius:12px;display:block;cursor:zoom-in;background:var(--line)}
figure .fl{position:absolute;left:10px;top:10px;background:var(--acc2);color:#fff;font-weight:700;border-radius:8px;padding:2px 10px}
figcaption{font-size:13px;color:var(--muted);margin-top:6px;font-style:italic}
textarea{width:100%;min-height:74px;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--field);resize:vertical;line-height:1.5}
textarea:focus,input:focus,.rte:focus{outline:2px solid color-mix(in srgb,var(--acc) 55%,transparent);border-color:transparent}
.who{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media(min-width:640px){.who{grid-template-columns:1fr 1fr}}
.who label{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.who label i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.who textarea{margin-top:6px}

/* revista: Analise mais a fundo */
.mag{margin:34px -16px 0;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 20px 12px}
@media(min-width:852px){.mag{margin:34px 0 0;border:1px solid var(--line);border-radius:18px;padding:36px 44px 20px}}
.mag .kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.mag>h3{font-family:var(--serif);font-size:30px;line-height:1.1;margin:4px 0 6px;font-weight:700}
.mag .lead{color:var(--muted);font-family:var(--serif);font-style:italic;margin:0 0 10px}
.art{padding:22px 0;border-top:1px solid var(--line)}
.art h4{font-family:var(--serif);font-size:22px;line-height:1.28;margin:0;font-weight:700;display:flex;gap:12px}
.art h4 .an{font-size:34px;line-height:.9;color:var(--acc);font-weight:700;flex:none}
.refs{font-size:13px;color:var(--muted);margin:8px 0 0 0}
.body{font-family:var(--serif);font-size:18px;line-height:1.7;margin-top:12px}
.body p{margin:0 0 .8em}
.body.filled::first-letter{float:left;font-size:3.1em;line-height:.85;padding:6px 8px 0 0;color:var(--acc);font-weight:700}
.body mark{background:#fde68a;color:inherit;padding:0 2px;border-radius:3px}
:root[data-theme="dark"] .body mark{background:#78350f}
.body .vazio{color:var(--muted);font-style:italic;font-size:15px}
.rte{min-height:110px;border:1px dashed color-mix(in srgb,var(--acc) 55%,transparent);border-radius:12px;padding:12px 14px;background:var(--field)}
.rte:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.tb{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.tb button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-width:36px;height:32px;padding:0 8px;font-size:14px}
.art figure{margin:16px 0}

/* vídeo */
.vcard{position:relative;display:block;width:100%;border:0;padding:0;border-radius:16px;overflow:hidden;background:#000 center/cover;aspect-ratio:16/9;box-shadow:var(--shadow);margin-top:18px}
.vcard .play{position:absolute;inset:0;margin:auto;width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;border:2px solid rgba(255,255,255,.85)}
.vcard .play svg{width:30px;height:30px;fill:#fff;margin-left:4px}
.vcard .vt{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);color:#fff;text-align:left;font-weight:600}
.vcard.noth{background:linear-gradient(135deg,#7c2d12,#c2410c)}
.vform{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;display:grid;gap:10px}
.vform label{font-size:13px;font-weight:700;color:var(--muted)}
.vform input[type=url],.vform input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:2px dashed var(--line);border-radius:16px;margin-top:18px}
.player{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:16px}
.player.on{display:flex}
.player .box{width:100%;max-width:1000px;aspect-ratio:16/9;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0}
.player .x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px}

/* quiz */
.quiz .qc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.quiz .qn{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.06em;text-transform:uppercase}
.quiz .qp{font-size:18px;font-weight:650;margin:4px 0 12px;line-height:1.35}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:12px;padding:12px 14px;margin-top:8px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:14px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt.bad .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.expl{margin-top:10px;font-size:14px;color:var(--muted);border-left:3px solid var(--acc);padding-left:10px}
.score{margin-top:18px;background:var(--accsoft);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px}
.score b{font-size:28px;color:var(--acc)}
.qe input[type=text],.qe textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);margin-top:0;min-height:0}
.qe .oe{display:flex;gap:8px;align-items:center;margin-top:8px}
.qe .oe input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.qe .oe .mini{flex:none}
.mini{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.hint{font-size:12px;color:var(--muted)}

.foot{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 50px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.del{color:var(--bad)}
.sp{flex:1}
.lb-x{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px}
.lb-x.on{display:flex}
.lb-x img{max-width:100%;max-height:82vh;border-radius:8px}
.lb-x p{color:#ddd;font-size:14px;max-width:760px;margin:0;text-align:center}
.menu{position:absolute;right:16px;top:52px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;min-width:210px}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--accsoft)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:.25s;z-index:70}
.toast.on{transform:translateX(-50%) translateY(0)}
.ce{border:1px dashed color-mix(in srgb,var(--acc) 55%,transparent);border-radius:8px;padding:4px 8px;background:var(--field);min-height:1.5em}
.ce:empty::before{content:attr(data-ph);color:var(--muted);font-weight:400;font-style:italic}
.ce.refs{margin-top:6px;font-size:13px}
.qh .ce:first-child{font-weight:600}
.art h4 .ce{font-family:var(--serif)}
.qtools{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.qtools .mini:disabled{opacity:.35}
.imgdel{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6)!important;color:#fff!important;border:0!important}
.chipx{border:0;background:none;color:inherit;padding:0 0 0 4px;font-size:12px}
.addq{margin-top:4px;margin-bottom:10px}
.mag .addq{margin-top:14px}
.cprow{display:flex;justify-content:flex-end;margin-top:8px}
.cpbtn{font-size:13px}
.art{position:relative}
.hide{display:none!important}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <button class="ib hide" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="bt">Ande Corajosamente com Deus</h1>
  <button class="btn sm hide" id="loginbar">Entrar</button>
  <span class="sync"><span class="dot" id="dot"></span><span id="st">…</span></span>
  <button class="ib" id="edit" aria-label="Modo editor" title="Modo editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="ib" id="theme" aria-label="Tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  <button class="ib" id="more" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  <div class="menu" id="menu">
    <div id="who" class="hint" style="padding:8px 12px"></div>
    <button id="login">Entrar com Google</button>
    <button id="logout" class="hide">Sair da conta</button>
    <button id="exp">Exportar tudo (backup)</button>
    <button id="imp">Importar backup</button>
  </div>
</div><div class="edbanner hide" id="edb">Modo editor ligado — edite, acrescente ou exclua perguntas, respostas da revista, vídeos e quiz</div></header>
<main class="wrap" id="app"></main>
<div class="lb-x" id="lbx"><img alt=""><p></p></div>
<div class="player" id="player"><button class="x" aria-label="Fechar">✕</button><div class="box"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json" class="hide">
<input type="file" id="thumbfile" accept="image/*" class="hide">
<input type="file" id="qimgfile" accept="image/*" class="hide">

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== CONFIGURAÇÃO DO FIREBASE =====
   Cole aqui o firebaseConfig do seu projeto. Vazio = funciona só no aparelho. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAXtmMoa0RaqL4nobei-zwi17JCRq8Zvj4",
  authDomain: "adoracao-em-familia.firebaseapp.com",
  projectId: "adoracao-em-familia",
  storageBucket: "adoracao-em-familia.firebasestorage.app",
  messagingSenderId: "325780268416",
  appId: "1:325780268416:web:0666420d722da06c508d65"
};
const FAMILIA = "familia"; // cada lição fica em estudoCoragem/familia/licoes/L{n}
// Quem pode acessar é definido nas REGRAS do Firestore (lista de e-mails do Google).

const PEOPLE=[{id:"alan",nome:"Alan",cor:"#2563eb"},{id:"atina",nome:"Átina",cor:"#db2777"}];
const SECOES=[
 {de:1,ate:21,t:"Seção 1",s:"Dos dias dos patriarcas ao tempo dos juízes"},

agos” faziam?</strong> (<a href=\"https://www.jw.org/finder?wtlocale=T&pub=nwtsty&bible=27001020-27001020\" target=\"_blank\" rel=\"noopener\">Dan. 1:20</a>; <a href=\"https://wol.jw.org/pt/wol/d/r5/lp-t/1200002834#h=3\" target=\"_blank\" rel=\"noopener\">it “Magia e feitiçaria” §§ 2-6</a>) <strong>B</strong>","img":[{"src":"1102025937_univ_cnt_3.webp","l":"B: Tabuinha babilônica que explica como “curar” um paciente que supostamente estava sendo atacado por um fantasma","alt":""}]},{"h":"<strong>Quais eram alguns dos vegetais que Daniel e seus amigos talvez tenham comido?</strong> (<a href=\"https://www.jw.org/finder?wtlocale=T&pub=nwtsty&bible=27001012-27001012\" target=\"_blank\" rel=\"noopener\">Dan. 1:12</a>; <a href=\"https://wol.jw.org/pt/wol/d/r5/lp-t/1101999022#h=33\" target=\"_blank\" rel=\"noopener\">dp 40 § 25</a>)"}]},{"t":"Medite no que aprendeu","q":[{"h":"Como os jovens podem imitar Daniel, mesmo quando estão longe da sua família?"},{"h":"Mesmo antes de surgir uma tentação, Daniel “decidiu no coração” obedecer a Jeová. (<a href=\"https://www.jw.org/finder?wtlocale=T&pub=nwtsty&bible=27001008-27001008\" target=\"_blank\" rel=\"noopener\">Dan. 1:8</a>) Como isso deu coragem para ele? Como podemos imitá-lo? <strong>C</strong>","img":[{"src":"1102025937_univ_cnt_4.webp","l":"C","alt":"Conjunto de imagens: 1. Uma irmã grávida usando um tablet, a Bíblia, o cartão Diretivas Antecipadas e um caderno de anotações para se preparar para o nascimento do seu bebê. 2. Um tempo depois, a irmã e seu marido estão em um consultório médico explicando a decisão dela sobre procedimentos médicos que envolvem sangue. O médico está analisando o cartão Diretivas dela enquanto escuta o que ela diz."}]},{"h":"De que outras maneiras você pode imitar a coragem de Daniel na sua vida?"}]},{"t":"Pense no quadro completo","q":[{"h":"O que esse relato me ensina sobre Jeová?"},{"h":"Como esse relato está relacionado com o propósito de Jeová?"},{"h":"O que eu gostaria de perguntar para let unsub=null,user=null;
function initFirebase(){
  if(!FIREBASE_CONFIG.projectId||!window.firebase){status("Só neste aparelho");return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    const auth=firebase.auth();
    auth.getRedirectResult().catch(e=>authErr(e));
    auth.onAuthStateChanged(u=>{
      user=u;updateUserUI();
      if(unsub){unsub();unsub=null}col=null;
      if(!u){status("Entre com Google para sincronizar");return}
      col=db.collection("estudoCoragem").doc(FAMILIA).collection("licoes");
      status("Conectando…","busy");let first=true;
      unsub=col.onSnapshot(snap=>{
        if(first){first=false;uploadLocalOnly(snap)}
        snap.docChanges().forEach(ch=>{
          const n=ch.doc.id.slice(1),d=ch.doc.data()||{},cur=lx(n);
          cur.a=Object.assign({},d.a||{},pendingOf(n));
          cur.done=d.done||undefined;cur.videos=d.videos||[];cur.quiz=d.quiz||[];if(d.est)cur.est=d.est;else delete cur.est;
        });
        saveLocal();onRemote();
        const p=snap.metadata.hasPendingWrites;status(p?"Salvando…":"Sincronizado",p?"busy":"on");
      },err=>{console.error(err);col=null;
        if(err.code==="permission-denied"){status("Sem acesso");toast("O e-mail "+(u.email||"")+" não tem permissão");}
        else status("Erro de sync")});
    });
  }catch(e){console.error(e);status("Só neste aparelho")}
}
// na primeira conexão, envia o que só existe neste aparelho
function uploadLocalOnly(snap){
  const inCloud=new Set(snap.docs.map(d=>d.id));
  for(const n in S.l){const c=S.l[n];if(inCloud.has("L"+n))continue;
    const has=Object.values(c.a||{}).some(v=>v)||c.done||(c.videos||[]).length||(c.quiz||[]).length||c.est;
    if(!has)continue;
    const doc={a:c.a||{}};if(c.done)doc.done=c.done;if(c.videos)doc.videos=c.videos;if(c.quiz)doc.quiz=c.quiz;if(c.est)doc.est=c.est;
    col.doc("L"+n).set(doc,{merge:true}).catch(console.error);
  }
}
function login(){
  if(!window.firebase||!firebase.apps.length)return toast("Configure o Firebase primeiro");
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  const a=firebase.auth();
  status("Entrando…","busy");
  // Sempre por janela (popup): o login por redirecionamento se perde no GitHub Pages,
  // porque o navegador bloqueia o armazenamento do domínio firebaseapp.com.
  a.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
   .then(()=>a.signInWithPopup(p))
   .then(r=>{if(r&&r.user)toast("Conectado: "+r.user.email)})
   .catch(e=>{
     if(e.code==="auth/popup-blocked")return toast("O navegador bloqueou a janela de login. Permita pop-ups para este site e tente de novo.");
     authErr(e)})
   .finally(()=>{if(!user)status("Entre com Google para sincronizar")});
}
function authErr(e){if(!e)return;console.error(e);
  const m={"auth/unauthorized-domain":"Domínio não autorizado: adicione "+location.hostname+" em Authentication → Settings → Authorized domains",
    "auth/operation-not-allowed":"Ative o provedor Google em Authentication → Sign-in method",
    "auth/network-request-failed":"Sem internet para entrar",
    "auth/internal-error":"Erro interno do login — confira o firebaseConfig"};
  if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request")return;
  toast(m[e.code]||("Não foi possível entrar ("+(e.code||e.message)+")"));
}
function updateUserUI(){
  const on=!!user,cfg=!!FIREBASE_CONFIG.projectId;
  $("#who").textContent=on?("Conectado: "+user.email):(cfg?"Não conectado":"Firebase não configurado");
  $("#login").classList.toggle("hide",on||!cfg);$("#logout").classList.toggle("hide",!on);
  $("#loginbar").classList.toggle("hide",on||!cfg);
}
const pend={};let tm=null;
function pendingOf(n){const o={};for(const k in pend)if(k.startsWith(n+"|"))o[k.split("|")[1]]=pend[k];return o}
function setAnswer(n,k,v){
  lx(n).a[k]=v;pend[n+"|"+k]=v;saveLocal();
  status(col?"Salvando…":"Salvo no aparelho",col?"busy":"");
  clearTimeout(tm);tm=setTimeout(flush,700);
}
function flush(){
  if(!col){for(const k in pend)delete pend[k];return}
  const by={};
  for(const k in pend){const[n,f]=k.split("|");(by[n]=by[n]||{})[f]=pend[k]===""?firebase.firestore.FieldValue.delete():pend[k];delete pend[k]}
  for(const n in by)col.doc("L"+n).set({a:by[n]},{merge:true}).catch(e=>{console.error(e);status("Erro ao salvar")});
}
function setField(n,f,v){ // done / videos / quiz
  const c=lx(n);if(v===undefined||v===null)delete c[f];else c[f]=v;saveLocal();
  if(col)col.doc("L"+n).set({[f]:v==null?firebase.firestore.FieldValue.delete():v},{merge:true}).catch(e=>{console.error(e);status("Erro ao salvar")});
  else status("Salvo no aparelho");

function splitQ(h){ // separa pergunta das referências
  const d=document.createElement("div");d.innerHTML=h;
  d.querySelectorAll(".tag").forEach(t=>t.remove());
  const st=d.querySelector("strong");let title,refs;
  if(st){title=st.innerHTML.trim();st.remove();refs=d.innerHTML.trim().replace(/^\(/,"").replace(/\)$/,"").trim()}
  else{const x=d.innerHTML.trim(),m=x.match(/^([\s\S]*?)\s*\(([^()]*)\)\s*$/);title=m?m[1]:x;refs=m?m[2]:""}
  return{title,refs:refs.replace(/[;,]\s*$/,"")};
}
const OK_TAGS=new Set(["B","STRONG","I","EM","U","BR","P","DIV","UL","OL","LI","MARK","A"]);
function sanitize(html){
  const d=document.createElement("div");d.innerHTML=html;
  (function walk(el){[...el.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1||!OK_TAGS.has(c.tagName)){if(c.nodeType===1){walk(c);c.replaceWith(...c.childNodes)}else c.remove();return}
    [...c.attributes].forEach(at=>{if(!(c.tagName==="A"&&at.name==="href"&&/^https?:/.test(at.value)))c.removeAttribute(at.name)});
    if(c.tagName==="A"){c.setAttribute("target","_blank");c.setAttribute("rel","noopener")}
    walk(c)})})(d);
  const out=d.innerHTML.replace(/(<br>|\s|&nbsp;)+$/,"").trim();
  return d.textContent.trim()?out:"";
}

function ytId(u){const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m&&m[1]}
function driveId(u){const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]+)/);return m&&m[1]}
function vimeoId(u){const m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);return m&&m[1]}
function jwLank(u){
  const m=u.match(/[?&]lank=([^&#]+)/)||u.match(/mediaitems\/[^/]+\/([^/?#]+)/i)||u.match(/\/(pub-[\w-]+_VIDEO|docid-[\w-]+_VIDEO)/i);
  return m&&decodeURIComponent(m[1]);
}
async function autoThumb(url){
  const y=ytId(url);if(y)return{thumb:`https://i.ytimg.com/vi/${y}/hqdefault.jpg`};
  const d=driveId(url);if(d)return{thumb:`https://drive.google.com/thumbnail?id=${d}&sz=w1000`};
  const v=vimeoId(url);if(v){try{const r=await(await fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`)).json();return{thumb:r.thumbnail_url,title:r.title}}catch(e){}}
  const j=jwLank(url);
  if(j){try{const r=await(await fetch(`https://b.jw-cdn.org/apis/mediator/v1/media-items/T/${encodeURIComponent(j)}?clientType=www`)).json();
    const it=r.media&&r.media[0];if(it){const im=it.images||{};const pick=(im.lss||im.wss||im.pnr||im.sqr||{});
      const files=(it.files||[]).filter(f=>f.progressiveDownloadURL).sort((a,b)=>(b.frameHeight||0)-(a.frameHeight||0));
      const f720=files.find(f=>(f.frameHeight||0)<=720)||files[0];
      return{thumb:pick.lg||pick.md||pick.sm||pick.xl||"",title:it.title,mp4:f720?f720.progressiveDownloadURL:""}}}catch(e){console.warn(e)}}
  if(/\.(mp4|webm|m4v)(\?|$)/i.test(url))return{mp4:url};
  return{};
}
function playVideo(v){
  const box=$("#player .box"),u=v.url;let h="";
  const y=ytId(u),d=driveId(u),vi=vimeoId(u);
  if(y)h=`<iframe src="https://www.youtube.com/embed/${y}?autoplay=1&rel=0" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`;
  else if(d)h=`<iframe src="https://drive.google.com/file/d/${d}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  else if(vi)h=`<iframe src="https://player.vimeo.com/video/${vi}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;

}

function compressImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const w=Math.min(800,im.width),h=Math.round(im.height*w/im.width),c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",.72))};im.onerror=rej;im.src=r.result};r.readAsDataURL(file)})}

function saveEst(n,e,now){lx(n).est=e;saveLocal();clearTimeout(estTimers[n]);const go=()=>setField(n,"est",lx(n).est);now?go():estTimers[n]=setTimeout(go,600)}
const imgSrc=s=>s.startsWith("data:")?s:"img/"+s;

function page1(l){
  const n=l.n,A=lx(n).a,E=est(l);
  const ta=(k,ph)=>`<textarea data-k="${k}" placeholder="${ph||"Resposta da família…"}"></textarea><div class="cprow"><button class="btn sm cpbtn" data-copyk="${k}">Copiar</button></div>`;
  const fig=(i,si,qi,ii)=>`<figure><img loading="lazy" src="${esc(imgSrc(i.src))}" alt="${esc(i.alt||"")}">${i.l?`<span class="fl">${esc(i.l)}</span>`:""}

      <button class="mini" data-a="down" data-s="${si}" data-q="${qi}" ${qi===len-1?"disabled":""} title="Descer">↓</button>
      <button class="mini" data-a="img" data-s="${si}" data-q="${qi}" title="Adicionar imagem">🖼</button>
      <button class="mini" data-a="delq" data-s="${si}" data-q="${qi}" title="Excluir pergunta" style="color:var(--bad)">✕</button></div>`:"";
  const qText=(si,qi,q,cls)=>EDIT
    ?`<div class="ce ${cls||""}" contenteditable="true" data-e="t" data-s="${si}" data-q="${qi}" data-ph="Escreva a pergunta…">${q.t}</div>
      <div class="ce refs" contenteditable="true" data-e="r" data-s="${si}" data-q="${qi}" data-ph="Referências (opcional) — ex.: Gên. 4:26; w01 15/9 29">${q.r||""}</div>`
    :`<span>${q.t}</span>`;

  let h=`<div class="leit"><span>Leia o relato na Bíblia:</span>${E.leitura.map((r,i)=>EDIT
      ?`<span class="chip">📖 ${esc(r.t)} <button class="chipx" data-a="dellei" data-i="${i}" title="Remover">✕</button></span>`
      :`<a class="chip" href="${esc(r.u)}" target="_blank" rel="noopener">📖 ${esc(r.t)}</a>`).join("")}
      ${EDIT?`<button class="btn sm" data-a="addlei">+ Texto</button>`:""}</div>
   <div class="pc"><div class="lb">Para considerar</div>
     ${EDIT?`<div class="ce q" contenteditable="true" data-e="pc" data-ph="Pergunta principal…">${esc(E.pc)}</div>`:`<div class="q">${esc(E.pc)}</div>`}
     ${ta("pc")}</div>`;

  E.sec.forEach((s,si)=>{
    const secTitle=EDIT?`<span class="ce" contenteditable="true" data-e="st" data-s="${si}">${esc(s.t)}</span>`:esc(s.t);
    const addBtn=EDIT?`<button class="btn sm addq" data-a="addq" data-s="${si}">+ Nova pergunta</button>`:"";
    if(si===0){ // revista
      h+=`<section class="mag"><div class="kick">Lição ${n} · ${esc(l.name)}</div><h3>${secTitle}</h3><p class="lead">${esc(l.title)}</p>`;
      s.q.forEach((q,qi)=>{
        const k=q.id,val=A[k]||"";
        h+=`<article class="art">${qTools(si,qi,s.q.length)}<h4><span class="an">${qi+1}</span>${EDIT?`<div style="flex:1">${qText(si,qi,q)}</div>`:`<span>${q.t}</span>`}</h4>
          ${!EDIT&&q.r?`<div class="refs">${q.r}</div>`:""}
          ${(q.img||[]).map((i,ii)=>fig(i,si,qi,ii)).join("")}
          ${EDIT?`<div class="tb" data-for="${k}">
              <button data-cmd="bold"><b>N</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>S</u></button>
              <button data-cmd="hilite">🖍</button><button data-cmd="insertUnorderedList">• Lista</button><button data-cmd="removeFormat">⌫ Formato</button></div>
            <div class="body rte" contenteditable="true" data-rk="${k}" data-ph="Escreva a resposta aqui…">${val}</div><div class="cprow"><button class="btn sm cpbtn" data-copyk="${k}">Copiar</button></div>`
          :`<div class="body ${val?"filled":""}">${val||`<span class="vazio">Resposta ainda não escrita — ative o modo editor (lápis) para escrever.</span>`}</div><div class="cprow"><button class="btn sm cpbtn" data-copyk="${k}">Copiar</button></div>`}
        </article>`;
      });
      if(!s.q.length&&!EDIT)h+=`<p class="vazio" style="color:var(--muted)">Sem perguntas.</p>`;
      h+=`${addBtn}</section>`;return;
    }
    h+=`<section class="sec"><h3>${secTitle}</h3>`;
    s.q.forEach((q,qi)=>{
      const field=si===2
        ?`<div class="who">${PEOPLE.map(p=>`<div><label><i style="background:${p.cor}">${p.nome[0]}</i>${p.nome}</label>${ta(`${q.id}-${p.id}`,"Resposta de "+p.nome+"…")}</div>`).join("")}</div>`
        :ta(q.id);
      h+=`<div class="qq">${qTools(si,qi,s.q.length)}<div class="qh">${EDIT?qText(si,qi,q):`${q.t}${q.r?` <span class="refs" style="display:inline">(${q.r})</span>`:""}`}</div>
        ${(q.img||[]).map((i,ii)=>fig(i,si,qi,ii)).join("")}${field}</div>`;

    <span class="sp"></span><a class="btn" href="#/l/${n}/2">Página 2: Vídeo →</a></div>`;
  return h;
}

/* ---- copiar "Analise mais a fundo" ---- */
const txt=h=>{const d=document.createElement("div");d.innerHTML=(h||"").replace(/<br\s*\/?>/gi,"\n").replace(/<\/(p|div|li)>/gi,"\n").replace(/<li[^>]*>/gi,"• ");return d.textContent.replace(/\u00a0/g," ").replace(/\n{3,}/g,"\n\n").trim()};
function copyAnalise(l,which){
  const s=est(l).sec[0],A=lx(l.n).a,qs=which==="all"?s.q:[s.q[+which]];
  const ans=qs.map(q=>A[q.id]||"").filter(h=>txt(h));
  if(!ans.length)return toast("Nada escrito ainda");
  return copyRich(ans.map(txt).join("\n\n"),ans.map(h=>`<div>${h}</div>`).join("<br>"));
}
async function copyRich(plain,html){
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/plain":new Blob([plain],{type:"text/plain"}),"text/html":new Blob([html],{type:"text/html"})})]);
    }else await navigator.clipboard.writeText(plain);
    toast("Copiado ✓");
  }catch(e){
    const ta=document.createElement("textarea");ta.value=plain;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("Copiado ✓")}catch(err){toast("Não consegui copiar")}ta.remove();
  }
}
function bindPage1(l){
  const n=l.n;
  document.querySelectorAll("[data-copyk]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.copyk,r=document.querySelector(`.rte[data-rk="${k}"]`),ta=document.querySelector(`textarea[data-k="${k}"]`);
    const html=r?sanitize(r.innerHTML):ta?"":(lx(n).a[k]||"");
    if(ta){const v=ta.value.trim();if(!v)return toast("Nada escrito ainda");return copyRich(v,esc(v).replace(/\n/g,"<br>"))}
    if(!txt(html))return toast("Nada escrito ainda");copyRich(txt(html),html)});
  document.querySelectorAll("textarea[data-k]").forEach(t=>{t.oninput=()=>{grow(t);setAnswer(n,t.dataset.k,t.value)}});
  const plainPaste=e=>{e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"))};
  document.querySelectorAll(".rte").forEach(r=>{
    r.oninput=()=>{clearTimeout(r._t);r._t=setTimeout(()=>setAnswer(n,r.dataset.rk,sanitize(r.innerHTML)),400)};
    r.onblur=()=>setAnswer(n,r.dataset.rk,sanitize(r.innerHTML));
    r.onpaste=plainPaste;
  });
  // textos da estrutura
  document.querySelectorAll(".ce[data-e]").forEach(c=>{
    c.onpaste=plainPaste;
    c.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();c.blur()}};
    const save=now=>{const E=estClone(l),k=c.dataset.e,si=+c.dataset.s,qi=+c.dataset.q;
      if(k==="pc")E.pc=c.textContent.trim();
      else if(k==="st")E.sec[si].t=c.textContent.trim();
      else E.sec[si].q[qi][k]=sanitize(c.innerHTML);
      saveEst(n,E,now)};
    c.oninput=()=>save(false);c.onblur=()=>save(true);
  });
  document.querySelectorAll("#app [data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a,si=+b.dataset.s,qi=+b.dataset.q,E=estClone(l),qs=E.sec[si]&&E.sec[si].q;
    if(a==="addq"){qs.push({id:"x"+Date.now().toString(36),t:"",r:"",img:[]});saveEst(n,E,true);render(true);
      const all=document.querySelectorAll(`.ce[data-e="t"][data-s="${si}"]`);const last=all[all.length-1];if(last){last.scrollIntoView({behavior:"smooth",block:"center"});last.focus()}return}
    if(a==="delq"){const t=(qs[qi].t||"").replace(/<[^>]+>/g,"").slice(0,80);if(!confirm(`Excluir esta pergunta?\n\n${t}`))return;qs.splice(qi,1)}
    else if(a==="up"&&qi>0)[qs[qi-1],qs[qi]]=[qs[qi],qs[qi-1]];
    else if(a==="down"&&qi<qs.length-1)[qs[qi+1],qs[qi]]=[qs[qi],qs[qi+1]];
    else if(a==="img"){imgTarget={n,si,qi};$("#qimgfile").click();return}
    else if(a==="delimg"){if(!confirm("Remover esta imagem?"))return;qs[qi].img.splice(+b.dataset.i,1)}
    else if(a==="dellei")E.leitura.splice(+b.dataset.i,1);
    else if(a==="addlei"){const t=prompt("Texto bíblico (ex.: Gênesis 5:21-24)");if(!t||!t.trim())return;
      const u=prompt("Link (opcional). Deixe em branco para buscar no WOL.","")||"";
      E.leitura.push({t:t.trim(),u:/^https?:/.test(u.trim())?u.trim():`https://wol.jw.org/pt/wol/s/r5/lp-t?q=${encodeURIComponent(t.trim())}`})}
    else if(a==="reset"){if(!confirm("Voltar todas as perguntas desta lição para o original do livro? As respostas já escritas continuam salvas."))return;
      delete lx(n).est;saveLocal();setField(n,"est",null);render(true);toast("Perguntas originais restauradas");return}
    else return;
    saveEst(n,E,true);render(true);
  });
  document.querySelectorAll(".tb button").forEach(b=>{
    b.onmousedown=e=>e.preventDefault();
    b.onclick=()=>{const r=document.querySelector(`.rte[data-rk="${b.parentElement.dataset.for}"]`);r.focus();
      const cmd=b.dataset.cmd;
      if(cmd==="hilite"){const sel=getSelection();if(sel.rangeCount&&!sel.isCollapsed){const rg=sel.getRangeAt(0),m=document.createElement("mark");try{rg.surroundContents(m)}catch(e){m.appendChild(rg.extractContents());rg.insertNode(m)}}}
      else if(cmd==="removeFormat"){document.execCommand("removeFormat");const sel=getSelection();if(sel.rangeCount){const a=sel.anchorNode&&sel.anchorNode.parentElement;const mk=a&&a.closest("mark");if(mk)mk.replaceWith(...mk.childNodes)}}
      else document.execCommand(cmd);
      r.dispatchEvent(new Event("input"))};
  });
  $("#done").onclick=()=>{const c=lx(n);setField(n,"done",c.done?null:new Date().toISOString().slice(0,10));render(true);if(lx(n).done)toast("Lição marcada como estudada ✓")};
  refreshFields(true);
}

const LET="ABCDEF";let play={};
function page3(l){
  const n=l.n,qz=lx(n).quiz||[];
  let h=`<div class="quiz">`;
  if(EDIT){
    h+=`<p class="hint" style="margin-top:16px">Marque a bolinha da alternativa correta. O comentário aparece depois de responder.</p>`;
    qz.forEach((q,i)=>{
      h+=`<div class="qc qe" data-qi="${i}"><div class="row"><span class="qn">Pergunta ${i+1}</span><span class="sp"></span>
        <button class="mini" data-a="up" title="Subir">↑</button><button class="mini" data-a="down" title="Descer">↓</button><button class="mini" data-a="del" title="Excluir" style="color:var(--bad)">✕</button></div>
        <textarea data-f="p" rows="2" placeholder="Escreva a pergunta…" style="margin-top:8px">${esc(q.p)}</textarea>
        ${q.o.map((o,oi)=>`<div class="oe"><input type="radio" name="c${i}" data-oi="${oi}" ${q.c===oi?"checked":""} title="Correta"><input type="text" data-o="${oi}" value="${esc(o)}" placeholder="Alternativa ${LET[oi]}">${q.o.length>2?`<button class="mini" data-a="rmo" data-oi="${oi}">−</button>`:""}</div>`).join("")}
        <div class="row" style="margin-top:8px">${q.o.length<6?`<button class="btn sm" data-a="addo">+ Alternativa</button>`:""}</div>
        <input type="text" data-f="e" value="${esc(q.e||"")}" placeholder="Comentário / texto bíblico (opcional)" style="margin-top:10px">
      </div>`;
    });
    h+=`<div class="foot" style="margin:16px 0 0"><button class="btn pri" id="addq">+ Nova pergunta</button></div>`;
  }else if(!qz.length){
    h+=`<div class="empty">Nenhuma pergunta sobre ${esc(l.name)} ainda.<br><span class="hint">Ative o modo editor (lápis) para criar perguntas de múltipla escolha.</span></div>`;
  }else{
    const st=play[n]||(play[n]={});
    qz.forEach((q,i)=>{const r=st[i];
      h+=`<div class="qc"><div class="qn">Pergunta ${i+1} de ${qz.length}</div><div class="qp">${esc(q.p)}</div>
        ${q.o.map((o,oi)=>{let cl="";if(r!==undefined){if(oi===q.c)cl="ok";else if(oi===r)cl="bad"}
          return `<button class="opt ${cl}" data-q="${i}" data-o="${oi}" ${r!==undefined?"disabled":""}><span class="l">${LET[oi]}</span><span>${esc(o)}</span></button>`}).join("")}
        ${r!==undefined&&q.e?`<div class="expl">${esc(q.e)}</div>`:""}
        ${r!==undefined?`<div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn sm" data-rq="${i}">Trocar resposta</button></div>`:""}</div>`});
    const resp=Object.keys(st).length,ac=Object.entries(st).filter(([i,r])=>qz[i]&&qz[i].c===r).length;
    if(resp===qz.length)h+=`<div class="score"><b>${ac}/${qz.length}</b><div style="flex:1">${ac===qz.length?"Excelente! Acertaram todas 🎉":"acertos"}</div><button class="btn sm" id="redo">Refazer</button></div>`;
    else if(resp)h+=`<div class="score"><b>${resp}/${qz.length}</b><div style="flex:1">respondidas</div><button class="btn sm" id="redo">Refazer tudo</button></div>`;
  }
  h+=`</div>`;
  const next=L.find(x=>x.n===n+1);
  h+=`<div class="foot"><a class="btn" href="#/l/${n}/2">← Página 2</a><span class="sp"></span>${next?`<button class="btn pri" data-go="${next.n}">Lição ${next.n}: ${esc(next.name)} →</button>`:""}</div>`;
  return h;
}

      if(a==="del"){if(!confirm("Excluir esta pergunta?"))return;qz.splice(i,1)}
      else if(a==="up"&&i>0)[qz[i-1],qz[i]]=[qz[i],qz[i-1]];
      else if(a==="down"&&i<qz.length-1)[qz[i+1],qz[i]]=[qz[i],qz[i+1]];
      else if(a==="addo")q().o.push("");
      else if(a==="rmo"){const oi=+b.dataset.oi;q().o.splice(oi,1);if(q().c>=q().o.length||q().c===oi)q().c=0;else if(q().c>oi)q().c--}
      saveQuiz(n,true);render(true)});
  });
}

function lesson(n,p){
  const l=L.find(x=>x.n===n);if(!l)return home();
  const same=view.name==="lesson"&&view.n===n&&view.p===p;
  view={name:"lesson",n,p};
  let h=lessonShell(l,p)+(p==2?page2(l):p==3?page3(l):page1(l));
  const y=scrollY;$("#app").innerHTML=h;
  (p==2?bindPage2:p==3?bindPage3:bindPage1)(l);
  return same?y:null;
}
function render(keepScroll){
  const m=location.hash.match(/#\/l\/(\d+)(?:\/(\d))?/);
  const y=scrollY;
  if(m){const p=+(m[2]||1);const prev=view;lesson(+m[1],p);
    if(keepScroll||(prev.name==="lesson"&&prev.n===+m[1]&&prev.p===p))window.scrollTo(0,y);
    else if(prev.name==="lesson"&&prev.n===+m[1]){const t=document.querySelector(".tabs");window.scrollTo(0,Math.min(y,t.offsetTop))}
    else window.scrollTo(0,0);
  }else home();
}
function grow(t){t.style.height="auto";t.style.height=Math.max(74,t.scrollHeight+2)+"px"}
function refreshFields(force){
  if(view.name!=="lesson")return;const A=lx(view.n).a;
  document.querySelectorAll("textarea[data-k]").forEach(t=>{
    if(!force&&document.activeElement===t)return;
    const v=A[t.dataset.k]||"";if(t.value!==v)t.value=v;grow(t);
  });
}
function onRemote(){
  if(view.name==="home"){if(!($("#q")&&$("#q").value))home(true);return}
  const a=document.activeElement;
  const editing=a&&(a.matches("textarea,input,.rte,.ce"));
  if(view.p===1&&!editing){render(true);return}
  if(view.p===1){refreshFields();return}
  if(!editing)render(true);
}

/* ===== eventos ===== */
addEventListener("hashchange",()=>render());
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){if(view.name==="home")sessionStorage.setItem("homeY",scrollY);location.hash="#/l/"+g.dataset.go+"/1";return}
  const im=e.target.closest("figure img");
  if(im){const b=$("#lbx");b.querySelector("img").src=im.src;b.querySelector("p").textContent=im.alt;b.classList.add("on");return}
  if(e.target.closest("#lbx"))$("#lbx").classList.remove("on");
  if(e.target.closest("#player .x")||e.target.id==="player")closePlayer();
  if(!e.target.closest("#more,#menu"))$("#menu").classList.remove("on");
});
addEventListener("keydown",e=>{if(e.key==="Escape"){closePlayer();$("#lbx").classList.remove("on")}});
$("#back").onclick=()=>{location.hash=""};
$("#more").onclick=()=>$("#menu").classList.toggle("on");
$("#login").onclick=$("#loginbar").onclick=()=>{$("#menu").classList.remove("on");login()};
$("#logout").onclick=()=>{$("#menu").classList.remove("on");if(confirm("Sair da conta? As respostas continuam salvas na nuvem."))firebase.auth().signOut()};
function applyEdit(){$("#edit").classList.toggle("on",EDIT);$("#edb").classList.toggle("hide",!EDIT);try{localStorage.setItem("coragem.edit",EDIT?"1":"0")}catch(e){}}
$("#edit").onclick=()=>{flush();EDIT=!EDIT;applyEdit();render(true);toast(EDIT?"Modo editor ligado":"Modo leitura")};

function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("coragem.theme",t)}catch(e){}
  document.querySelector('meta[name=theme-color]').content=t==="dark"?"#14120f":"#c2410c"}
let th;try{th=localStorage.getItem("coragem.theme")}catch(e){}
applyTheme(th||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#theme").onclick=()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

$("#exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="coragem-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.l)throw 0;
  for(const n in d.l){const x=d.l[n];for(const k in x.a||{})setAnswer(n,k,x.a[k]);
    ["done","videos","quiz"].forEach(f=>{if(x[f]!==undefined)setField(n,f,x[f])})}
  flush();render();toast("Backup importado")}catch(err){toast("Arquivo inválido")}e.target.value=""};

if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
applyEdit();updateUserUI();initFirebase();render();
</script>
</body>
</html>
