<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alan & Átina: Nossa adoração em família</title>
<meta name="description" content="Estudo bíblico em família: leitura, perguntas, vídeo e reflexão, tudo salvo no aparelho.">
<meta name="theme-color" content="#F3F0EC" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alan & Átina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- paleta Discurso Público: claro ---------- */
:root{
  --bg:#F3F0EC; --stripe:rgba(193,86,26,.055); --top-bg:rgba(243,240,236,.92);
  --card:#FFFFFF; --soft:#FBE7DA; --field:#FBF9F7; --ink:#2B221D; --mute:#7B6B61; --line:#E7DDD4;
  --acc:#C1561A; --acc-ink:#A94A16; --on-acc:#FFFFFF;
  --nav-bg:#2B221D; --nav-ink:#BFAFA4; --card-shadow:0 3px 0 #E7DDD4;
  --ok:#2F8A57; --ok-bg:#E6F4EC; --ok-ink:#1D5C39; --bad:#C0473F; --bad-bg:#FBEAE8; --bad-ink:#8A2A24;
  --gold:#E0A43A; --p2:#2F6E8A;
  --display:'Baloo 2', 'Nunito', system-ui, sans-serif; --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:Georgia, 'Times New Roman', serif;
  --r-sm:14px; --r-md:22px; --r-lg:28px;
  color-scheme:light;
}
/* ---------- escuro ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120F; --stripe:rgba(255,255,255,.028); --top-bg:rgba(23,18,15,.92);
    --card:#231C18; --soft:#3A2418; --field:#1B1512; --ink:#F2EAE3; --mute:#A89A8F; --line:#3A302A;
    --acc:#C1561A; --acc-ink:#EE8F57; --on-acc:#FFFFFF;
    --nav-bg:#0D0A08; --nav-ink:#9C8E84; --card-shadow:0 3px 0 #0D0A08;
    --ok:#3FA56B; --ok-bg:#15301F; --ok-ink:#8FD9AE; --bad:#D65A50; --bad-bg:#3A1A17; --bad-ink:#F0A39C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17120F; --stripe:rgba(255,255,255,.028); --top-bg:rgba(23,18,15,.92);
  --card:#231C18; --soft:#3A2418; --field:#1B1512; --ink:#F2EAE3; --mute:#A89A8F; --line:#3A302A;
  --acc:#C1561A; --acc-ink:#EE8F57; --on-acc:#FFFFFF;
  --nav-bg:#0D0A08; --nav-ink:#9C8E84; --card-shadow:0 3px 0 #0D0A08;
  --ok:#3FA56B; --ok-bg:#15301F; --ok-ink:#8FD9AE; --bad:#D65A50; --bad-bg:#3A1A17; --bad-ink:#F0A39C;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background-color:var(--bg);
  background-image:repeating-linear-gradient(135deg,var(--stripe) 0 2px,transparent 2px 12px);background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
img,video{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--top-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0;border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-bottom:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1}
.brand small{display:block;font-size:.74rem;font-weight:700;color:var(--mute);margin-top:2px}
.icb{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:var(--card-shadow);cursor:pointer;flex:none}
.icb svg{width:21px;height:21px}
.icb[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);box-shadow:none}
.editstrip{max-width:560px;margin:0 auto 8px;background:var(--acc);color:var(--on-acc);border-radius:12px;padding:6px 12px;font-size:.8rem;font-weight:800;display:none;justify-content:space-between;gap:8px}
.is-edit .editstrip{display:flex}
.rbar{height:3px;margin:0 -14px;background:transparent;position:relative;display:none}
.rbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);width:0}
.rbar.on{display:block}

main{max-width:560px;margin:0 auto;padding:16px 14px calc(120px + env(safe-area-inset-bottom))}
.page.anim{animation:pagein .16s ease-out}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ptitle{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05;margin:2px 2px 14px}

/* ---------- abas ---------- */
.tabs{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(536px,calc(100% - 20px));background:var(--nav-bg);border-radius:26px;padding:7px;display:flex;gap:2px;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.55)}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--nav-ink);font-weight:800;font-size:.6rem;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:19px;cursor:pointer}
.tabs svg{width:21px;height:21px}
.tabs button[aria-current="page"]{background:var(--acc);color:#fff}

/* ---------- elementos ---------- */
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--acc-ink);white-space:nowrap}
.btn{border:0;background:var(--acc);color:var(--on-acc);font-weight:800;border-radius:var(--r-sm);padding:10px 16px;font-size:.9rem;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--acc-ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.tiny{padding:6px 11px;font-size:.78rem;border-radius:11px}
.btn.wide{width:100%;padding:14px;font-size:1rem}
.ic{width:30px;height:30px;border-radius:10px;border:0;background:var(--soft);color:var(--acc-ink);cursor:pointer;display:grid;place-items:center;font-size:.9rem;line-height:1;flex:none}
.ic.del{color:var(--bad)}
.upl{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--acc-ink);cursor:pointer;background:var(--soft);padding:7px 12px;border-radius:11px;margin-top:8px}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.card{background:var(--card);border-radius:var(--r-md);padding:16px;margin:0 0 14px;box-shadow:var(--card-shadow)}
.hint{font-size:.76rem;color:var(--mute);margin:2px 0 10px}
.sec-t{font-weight:800;font-size:.85rem;color:var(--mute);margin:22px 2px 10px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:block;font-size:.8rem;font-weight:800;color:var(--mute);margin:0 0 12px}
.field input,.field textarea{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;background:var(--card);font-size:1rem;font-weight:600}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.banner{background:var(--ink);color:var(--bg);border-radius:var(--r-sm);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:.84rem;font-weight:700;margin:0 0 14px}
.banner .btn{background:var(--acc);padding:7px 12px;font-size:.78rem;flex:none}
.empty{text-align:center;padding:20px 16px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--card-shadow);margin:0 0 14px}
.empty svg{width:72px;height:72px;margin:0 auto 6px;display:block}
.empty b{font-family:var(--display);display:block;font-size:1.15rem}
.empty small{font-size:.8rem;color:var(--mute)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}

/* perfis */
.who{display:flex;gap:8px;margin:0 0 14px}
.who button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:9px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:.9rem;color:var(--mute);cursor:pointer}
.who button.on{border-color:var(--acc);color:var(--ink);background:var(--soft)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:.9rem;flex:none;background:var(--acc)}
.av.p2{background:var(--p2)}
.av.sm{width:20px;height:20px;font-size:.62rem}

/* início */
.greet{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05;margin:2px 2px 12px}
.greet small{display:block;font-family:var(--body);font-size:.78rem;color:var(--mute);font-weight:700;margin-top:4px}
.cont{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:11px;box-shadow:var(--card-shadow);margin:0 0 10px}
.cont .cov,.cont img{width:74px;height:74px;border-radius:16px;flex:none;object-fit:cover;background:var(--soft)}
.cont .tt{flex:1;min-width:0}
.cont b{display:block;font-size:1rem;line-height:1.2}
.cont small{font-size:.74rem;color:var(--mute)}
.ring{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:attr(data-l);width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.68rem;font-weight:800;color:var(--acc-ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.steps>div{background:var(--card);box-shadow:var(--card-shadow);border-radius:var(--r-sm);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute)}
.steps button{border:0;background:none;padding:0;cursor:pointer;color:inherit;font-size:.66rem;font-weight:800}
.steps .chkstep{padding:4px}
.steps .chkstep i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.72rem;transition:transform .12s}
.steps .chkstep:active i{transform:scale(.9)}
.steps .golbl{padding:2px 6px;border-radius:8px}
.steps>div.done{color:var(--ok-ink)}
.steps>div.done .chkstep i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps>div.now{color:var(--acc-ink)}
.steps>div.now .chkstep i{border-color:var(--acc);border-style:dashed}
.streak{display:flex;align-items:center;gap:12px}
.streak b{font-family:var(--display);font-size:2rem;line-height:1;color:var(--acc-ink)}
.streak span{display:block;font-weight:800;font-size:.86rem}
.streak small{font-size:.74rem;color:var(--mute)}
.week{display:flex;justify-content:space-between;margin-top:12px}
.week span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:800;color:var(--mute);background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line)}
.week span.y{background:var(--acc);color:#fff;box-shadow:none}
.week span.t{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc-ink)}
.week span.y.t{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}

/* leitura */
.rtools{display:flex;gap:6px;justify-content:flex-end;margin:0 0 10px}
.rtools button{border:0;background:var(--card);box-shadow:var(--card-shadow);border-radius:11px;padding:7px 11px;font-weight:800;font-size:.8rem;cursor:pointer}
.rtools button.on{background:var(--acc);color:#fff;box-shadow:none}
.cover{position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--card-shadow);overflow:hidden}
.cover img,.cover .noimg{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:22px;padding:8px}
.cover .noimg{display:grid;place-items:center;background:var(--soft);background-clip:content-box;color:var(--mute);font-weight:700;font-size:.85rem}
.cover .upl{position:absolute;top:18px;right:18px;margin:0;background:rgba(255,255,255,.94);color:#2B221D}
.cv-txt{padding:6px 18px 20px}
.kicker{display:inline-block;background:var(--acc);color:#fff;padding:3px 11px;border-radius:999px;font-size:.76rem;font-weight:800;margin:0 0 8px}
.cover h2{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,2.6rem);line-height:1.02;margin:0}
.cover .sub{margin:8px 0 0;font-size:.98rem;color:var(--mute);line-height:1.45}
.cover .rt{margin:10px 0 0;font-size:.76rem;color:var(--mute);font-weight:700}
.article{padding:18px 4px 4px;font-size:calc(1rem * var(--fs,1))}
.article.serif .blk-p,.article.serif .blk-q{font-family:var(--serif)}
.blk{position:relative}
.blk-h{font-family:var(--display);font-weight:800;font-size:1.5em;line-height:1.15;margin:22px 0 6px}
.blk-p{font-size:1.04em;line-height:1.72;margin:0 0 14px}
.blk-q{margin:18px 0;padding:16px 18px;background:var(--soft);border-radius:var(--r-md);font-style:italic;font-size:1.04em;line-height:1.55;color:var(--ink)}
.blk-q cite{display:block;font-style:normal;font-size:.8rem;font-weight:800;margin-top:8px;color:var(--acc-ink)}
.blk-img{margin:18px 0}
.blk-img img{width:100%;border-radius:var(--r-md);aspect-ratio:16/10;object-fit:cover}
.blk-img figcaption{font-size:.8rem;color:var(--mute);margin-top:6px}
.ref{display:inline;border:0;background:var(--soft);color:var(--acc-ink);font-weight:800;padding:0 6px;border-radius:7px;font-size:.94em;font-style:normal;cursor:pointer;text-decoration:underline dotted;font-family:var(--body)}
.readend{text-align:center;margin:26px 0 8px}
.is-edit [contenteditable]{outline:2px dashed transparent;outline-offset:3px;border-radius:6px;cursor:text}
.is-edit [contenteditable]:hover{outline-color:var(--line)}
.is-edit [contenteditable]:focus{outline:2px solid var(--acc)}
.is-edit .blk{padding:6px 0 4px 16px}
.grip{position:absolute;left:0;top:10px;width:10px;height:28px;border-radius:4px;cursor:grab;touch-action:none;
  background:radial-gradient(circle,var(--mute) 1.4px,transparent 1.7px) 0 0/5px 5px}
.blk.dragging{opacity:.4}
.blk.drop-before{box-shadow:0 -3px 0 0 var(--acc)}
.blk.drop-after{box-shadow:0 3px 0 0 var(--acc)}
.blk-tools{display:flex;gap:6px;justify-content:flex-end;margin-bottom:4px}
.plus{display:flex;align-items:center;gap:8px;margin:4px 0}
.plus::before,.plus::after{content:"";flex:1;height:2px;background:var(--line)}
.plus button{width:28px;height:28px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:1.1rem;line-height:1;cursor:pointer}

/* folha inferior */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:7}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);background:var(--card);border-radius:24px 24px 0 0;
  padding:14px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:8;animation:sheetin .22s ease-out;max-height:80dvh;overflow:auto}
@keyframes sheetin{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-size:1.2rem;margin:0 0 8px}
.sheet p{font-size:.95rem;line-height:1.55;margin:0 0 12px}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.kinds button,.tpl button{border:0;background:var(--field);border-radius:var(--r-sm);padding:12px 6px;font-size:.74rem;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.kinds button i{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:1.1rem;color:var(--acc-ink)}
.tpl{display:grid;gap:8px;margin:6px 0 12px}
.tpl button{flex-direction:row;justify-content:flex-start;text-align:left;padding:12px 14px;gap:12px}
.tpl button b{display:block;font-size:.92rem}
.tpl button small{display:block;font-weight:600;color:var(--mute);font-size:.74rem}

/* perguntas */
.qprog{display:flex;gap:4px;margin:0 0 14px}
.qprog button{flex:1;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer}
.qprog button.d{background:var(--acc)}
.qprog button.r{background:var(--ok)}
.qprog button.w{background:var(--bad)}
.qcard{animation:pagein .2s ease-out}
.qn{display:inline-block;background:var(--acc);color:#fff;padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:800;margin:0 0 8px}
.qt{font-weight:800;font-size:1.1rem;line-height:1.35;margin:0 0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--field);border-radius:var(--r-sm);padding:12px 14px;margin:0 0 8px;font-size:.98rem;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.opt.right .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink);animation:shake .3s}
.opt.wrong .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qwhy{background:var(--soft);border-radius:var(--r-sm);padding:11px 13px;font-size:.9rem;line-height:1.5;margin:4px 0 12px;animation:pagein .2s}
.qwhy b{color:var(--acc-ink)}
.opt-edit{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.opt-edit input[type=radio]{accent-color:var(--ok);width:22px;height:22px;flex:none;margin:0}
.otxt{flex:1;border:2px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:.95rem;font-weight:700;background:var(--field)}
.opt-edit.is-right .otxt{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.score{text-align:center;padding:22px 18px;border-radius:var(--r-md);background:var(--acc);color:#fff;font-weight:700;position:relative;overflow:hidden}
.score b{font-family:var(--display);font-size:2.4rem;display:block;line-height:1.1}
.score .row2{justify-content:center;margin-top:12px;position:relative}
.score .btn{background:#fff;color:#A94A16}
.score .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.conf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.7s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(260px) rotate(420deg);opacity:0}}

/* vídeo */
.vbox{border-radius:var(--r-lg);overflow:hidden;background:#100C0A;aspect-ratio:16/9;position:relative;display:grid;place-items:center}
.vbox video{width:100%;height:100%;object-fit:contain;background:#000}
.vbox .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:relative;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.play::after{content:"";border-left:18px solid #2B221D;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.vmsg{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:.82rem;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 14px}
.vmiss{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#fff;font-size:.86rem;font-weight:800;background:rgba(16,12,10,.6)}

/* reflexão */

  background-color:var(--field);background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-attachment:local;

@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(192,71,63,.25)}}
.wave{flex:1;display:flex;gap:2px;align-items:center;height:28px}

  padding:11px 20px;border-radius:999px;font-weight:800;font-size:.9rem;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}

<script>
const svgURI = s => 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
function wheat(){let s='';for(let i=0;i<46;i++){const x=6+i*8.8+(i%3)*2,h=40+(i*37%30),y=300;
  s+=`<path d="M${x} ${y} Q${x+3} ${y-h/2} ${x+1} ${y-h}" stroke="#8A6630" stroke-width="1.6" fill="none"/><ellipse cx="${x+1}" cy="${y-h-6}" rx="3.2" ry="9" fill="#D9B45E"/>`;}return s;}
const IMG_RUTE = svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9B97A"/><stop offset=".55" stop-color="#F5DEAF"/><stop offset="1" stop-color="#F1D9A2"/></linearGradient></defs><rect width="400" height="300" fill="url(#s)"/><circle cx="296" cy="120" r="38" fill="#FCF0D2"/><path d="M0 160 Q90 128 180 152 T330 140 T400 146 V300 H0Z" fill="#C8A462"/><path d="M0 200 Q110 172 210 192 T400 182 V300 H0Z" fill="#AD8543"/><g transform="translate(150 176)"><circle cx="0" cy="-26" r="5" fill="#4E3A28"/><path d="M-6 -20 L6 -20 L9 6 L-9 6Z" fill="#6B4E36"/><circle cx="18" cy="-24" r="4.6" fill="#4E3A28"/><path d="M12 -18 L24 -18 L26 6 L10 6Z" fill="#8F6B4A"/></g>${wheat()}</svg>`);
const IMG_ROAD = svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice"><rect width="400" height="250" fill="#CFE0E3"/><path d="M0 120 Q100 90 200 110 T400 100 V250 H0Z" fill="#9FB58A"/><g fill="#E8DCC4"><rect x="250" y="70" width="18" height="22"/><rect x="270" y="62" width="22" height="30"/><rect x="294" y="74" width="16" height="18"/><rect x="232" y="78" width="16" height="14"/></g><path d="M0 160 Q120 130 220 150 T400 140 V250 H0Z" fill="#7F9A6B"/><path d="M170 250 Q200 180 262 98 L270 98 Q230 180 240 250Z" fill="#E4D2AE"/><g transform="translate(206 186)"><circle cx="0" cy="-22" r="4.5" fill="#3E3024"/><path d="M-6 -17 L6 -17 L8 4 L-8 4Z" fill="#5C4A7A"/><circle cx="15" cy="-20" r="4.2" fill="#3E3024"/><path d="M10 -15 L21 -15 L23 4 L8 4Z" fill="#A5563A"/></g></svg>`);
const IMG_POSTER = svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B3F5C"/><stop offset="1" stop-color="#C98A4B"/></linearGradient></defs><rect width="320" height="180" fill="url(#g)"/><path d="M0 120 Q80 96 160 116 T320 108 V180 H0Z" fill="#3B2F25" opacity=".8"/></svg>`);
const CHEST = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="26" width="48" height="28" rx="4" fill="#8A5A2B"/><path d="M8 30 Q8 12 32 12 Q56 12 56 30Z" fill="#A86D35"/><rect x="8" y="26" width="48" height="5" fill="#E0A43A"/><rect x="28" y="23" width="8" height="12" rx="2" fill="#F2C35A"/><circle cx="32" cy="30" r="1.8" fill="#6B4115"/><rect x="14" y="31" width="4" height="23" fill="#E0A43A"/><rect x="46" y="31" width="4" height="23" fill="#E0A43A"/><circle cx="22" cy="16" r="2" fill="#FFF3C4"/><circle cx="44" cy="10" r="1.5" fill="#FFF3C4"/></svg>`;

/* =============== dados iniciais =============== */
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const P1='p1', P2='p2';
function blankStudy(){
  return {id:uid(), createdAt:Date.now(), kicker:'Nova lição', title:'Título do estudo', sub:'Uma frase curta sobre o relato.', cover:'',
    blocks:[{t:'p', text:'Escreva aqui o primeiro parágrafo.'}], quiz:[{q:'Nova pergunta', o:['Alternativa A','Alternativa B','Alternativa C'], c:0, why:''}],
    vtitle:'Título do vídeo', vdesc:'Uma orientação curta para quem vai assistir.', hasVideo:false, vname:'', vsize:0, vdur:0, vpos:0, watched:false, person:'',
    verses:{}, audios:{}, read:false,
    answers:{}, steps:{}, reflex:{[P1]:['',''],[P2]:['','']}, done:false, doneAt:null};
}
const TEMPLATES = {
  blank:{n:'Em branco', d:'Um parágrafo e uma pergunta para começar do zero.', make:()=>blankStudy()},
  person:{n:'Personagem bíblico', d:'Capa, quem foi, o que fez, versículo em destaque e 4 perguntas.', make:()=>({...blankStudy(), kicker:'Livro cap. 1', title:'Nome do personagem', sub:'Uma frase sobre o que ele ou ela fez.', person:'Nome',
    blocks:[{t:'p',text:'Quem foi essa pessoa, onde vivia e o que estava acontecendo na época.'},{t:'h',text:'O que aconteceu'},{t:'p',text:'O relato em poucas frases: o problema, a decisão e o resultado.'},{t:'q',text:'Um versículo que resume a atitude do personagem.',cite:'Livro 1:1'},{t:'h',text:'O que aprendemos'},{t:'p',text:'Como esse exemplo se aplica à nossa família hoje.'}],
    quiz:[{q:'Onde o relato aconteceu?',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''},{q:'Qual foi a decisão mais difícil?',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''},{q:'Que qualidade se destacou?',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''},{q:'Qual foi o resultado?',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''}]})},
  chapter:{n:'Capítulo do livro', d:'Contexto, o capítulo em partes e 3 perguntas.', make:()=>({...blankStudy(), kicker:'Livro, capítulo', title:'Título do capítulo', sub:'Do que trata este capítulo.',
    blocks:[{t:'p',text:'Contexto: o que veio antes e quem está falando.'},{t:'h',text:'Primeira parte'},{t:'p',text:'Resumo dos primeiros versículos.'},{t:'h',text:'Segunda parte'},{t:'p',text:'Resumo dos versículos seguintes.'}],
    quiz:[{q:'Pergunta sobre a primeira parte',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''},{q:'Pergunta sobre a segunda parte',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''},{q:'Qual é a lição principal?',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''}]})},
  principle:{n:'Princípio para a família', d:'Um princípio, um versículo e como praticar em casa. 2 perguntas.', make:()=>({...blankStudy(), kicker:'Princípio', title:'Nome do princípio', sub:'Por que ele importa na nossa casa.',
    blocks:[{t:'q',text:'O versículo que ensina esse princípio.',cite:'Livro 1:1'},{t:'p',text:'O que o princípio significa, com palavras simples.'},{t:'h',text:'Como praticar em casa'},{t:'p',text:'Duas ou três situações do dia a dia em que ele se aplica.'}],
    quiz:[{q:'O que esse princípio pede de nós?',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''},{q:'Em que situação da semana ele se aplica?',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''}]})}
};
function seed(){
  const rute = {...blankStudy(), kicker:'Rute 1 a 4', title:'Rute, a lealdade que abençoa',
    sub:'Uma moabita que escolheu servir a Jeová ao lado de Noemi.', cover:IMG_RUTE,
    blocks:[
      {t:'p', text:'Depois de perder o marido e os dois filhos em Moabe, Noemi decidiu voltar para Belém. Suas noras, Orfa e Rute, começaram a viagem com ela, mas só uma continuou até o fim.'},
      {t:'q', text:'Aonde você for, eu irei, e onde você passar a noite, eu passarei a noite. Seu povo será o meu povo, e seu Deus será o meu Deus.', cite:'Rute 1:16'},
      {t:'h', text:'Uma escolha que custou caro'},
      {t:'p', text:'Rute deixou sua terra, sua família e seus deuses. Em Belém, trabalhou duro respigando cevada no campo de Boaz para sustentar a sogra (Rute 2:2, 3).'},
      {t:'img', src:IMG_ROAD, cap:'Rute e Noemi chegam a Belém no começo da colheita da cevada.'},
      {t:'p', text:'Boaz notou a bondade leal de Rute e cuidou dela. Mais tarde, os dois se casaram, e Rute se tornou antepassada do rei Davi e de Jesus.'}],
    quiz:[
      {q:'Para qual cidade Noemi decidiu voltar?', o:['Jericó','Belém','Hebrom','Siló'], c:1, why:'Belém, porque Noemi soube que Jeová tinha voltado a dar pão ao seu povo (Rute 1:6).'},
      {q:'Em que campo Rute foi respigar?', o:['No campo de Boaz','No campo de Elimeleque','No campo de Obede'], c:0, why:'"Por acaso" ela foi parar no campo de Boaz, parente de Elimeleque (Rute 2:3).'},
      {q:'Qual das noras voltou para o seu povo?', o:['Rute','Mara','Orfa'], c:2, why:'Orfa beijou Noemi e voltou; Rute "se apegou" a ela (Rute 1:14).'},
      {q:'Que rei foi bisneto de Rute?', o:['Saul','Salomão','Davi','Ezequias'], c:2, why:'Obede gerou Jessé, e Jessé gerou Davi (Rute 4:22).'}],
    verses:{'Rute 1:16':'Mas Rute disse: "Não insista comigo para que eu a abandone e deixe de acompanhá-la; pois aonde você for, eu irei, e onde você passar a noite, eu passarei a noite. Seu povo será o meu povo, e seu Deus será o meu Deus."'},
    vtitle:'Rute escolhe Jeová', vdesc:'Assista ao vídeo e preste atenção em como Rute tratou Noemi nos momentos difíceis.', person:'Rute'};
  return {studies:[rute], currentId:rute.id, lastBackup:null, profiles:[{id:P1,name:'Alan'},{id:P2,name:'Átina'}], reminder:{on:false, day:2, hour:20}};
}
/* migra dados de versões anteriores (uma resposta só por estudo) */
function migrate(d){
  if(!Array.isArray(d.profiles) || d.profiles.length<2) d.profiles=[{id:P1,name:'Alan'},{id:P2,name:'Átina'}];
  if(!d.reminder) d.reminder={on:false, day:2, hour:20};
  for(const s of d.studies){
    if(!s.reflex || Array.isArray(s.reflex)){ const r = Array.isArray(s.reflex) ? s.reflex : ['','']; s.reflex = {[P1]:r, [P2]:['','']}; }
    for(const p of d.profiles){ if(!s.reflex[p.id]) s.reflex[p.id]=['','']; }
    if(!s.answers) s.answers={};
    if(s.answers[P1] || s.answers[P2]){ const a=s.answers[P1]||{}; s.answers = Object.keys(a).length ? a : (s.answers[P2]||{}); }
    if(!s.steps) s.steps={};
    if(!s.verses) s.verses={}; if(!s.audios) s.audios={};
    if(s.read===undefined) s.read=false; if(s.watched===undefined) s.watched=false;
    if(s.vpos===undefined) s.vpos=0; if(s.vsize===undefined) s.vsize=0; if(s.vdur===undefined) s.vdur=0;
    s.quiz.forEach(q=>{ if(q.why===undefined) q.why=''; });
  }
  return d;
}

/* =============== armazenamento no aparelho =============== */
const APP_ID='alan-atina-adoracao';
const IDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open(APP_ID,1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); r.result.createObjectStore('videos'); };
    r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  req(store, mode, fn){ return new Promise((res,rej)=>{ const q=fn(this.db.transaction(store,mode).objectStore(store)); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  get(st,k){ return this.req(st,'readonly',o=>o.get(k)); },
  put(st,k,v){ return this.req(st,'readwrite',o=>o.put(v,k)); },
  del(st,k){ return this.req(st,'readwrite',o=>o.delete(k)); },
  clear(st){ return this.req(st,'readwrite',o=>o.clear()); }
};
let idbOK=false, D=null, saveTimer=null;
const UI = {mode:'leitor', theme:'auto', withVideos:true, fs:1, serif:false, who:P1, pendingRestore:null, delArm:null, sheet:null, qi:null, qiFor:'', flip:null, update:false, rec:null};
const vurl = {};
let TAB = 'inicio';

async function persist(){
  try{
    if(idbOK) await IDB.put('kv','db',D); else localStorage.setItem('aa-db', JSON.stringify(D));
    setSaveState('Salvo');
  }catch{ setSaveState('Não salvou'); toast('Não foi possível salvar. O armazenamento do aparelho pode estar cheio.'); }
}
function save(){ setSaveState('Salvando…'); clearTimeout(saveTimer); saveTimer=setTimeout(persist,400); }
function setSaveState(t){ document.querySelectorAll('[data-savestate]').forEach(e=>e.textContent=t); }
function saveUI(){ try{ localStorage.setItem('aa-ui', JSON.stringify({mode:UI.mode, theme:UI.theme, withVideos:UI.withVideos, fs:UI.fs, serif:UI.serif, who:UI.who})); }catch{} }

const audKey = (s,pid,i) => `aud:${s.id}:${pid}:${i}`;
async function loadBlob(key){
  if(!key || vurl[key]!==undefined || !idbOK) return;
  try{ const v=await IDB.get('videos',key); vurl[key] = v ? URL.createObjectURL(v.blob) : null; }catch{ vurl[key]=null; }
}
function dropURL(key){ if(vurl[key]) URL.revokeObjectURL(vurl[key]); delete vurl[key]; }
async function loadStudyMedia(s){
  if(!s) return;
  if(s.hasVideo) await loadBlob(s.id);
  for(const k of Object.keys(s.audios||{})) await loadBlob('aud:'+s.id+':'+k);
}
function mediaKeys(s){ const k=[]; if(s.hasVideo) k.push(s.id); for(const a of Object.keys(s.audios||{})) k.push('aud:'+s.id+':'+a); return k; }

/* downloads: dentro do visualizador do Claude usa a capacidade; no GitHub Pages usa link normal */
let DL='pending';
if(window.claude && typeof window.claude.use==='function'){
  window.claude.use('downloads').then(d=>{ DL=d||null; if(D && TAB==='bau') render(); }).catch(()=>{ DL=null; if(D && TAB==='bau') render(); });
} else DL='native';
async function offerFile(filename, blob){
  if(DL==='native'){
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); return true;
  }
  if(!DL) return false;
  try{ await DL.save({filename, data:blob}); return true; }
  catch(e){ toast(e && e.code==='declined' ? 'Cancelado.' : 'Não foi possível salvar o arquivo aqui.'); return false; }
}

const mq = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const root=document.documentElement;
  if(UI.theme==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', UI.theme);
  const dark = UI.theme==='dark' || (UI.theme==='auto' && mq.matches);

  b.innerHTML = ICON['th_'+UI.theme]; b.title=label; b.setAttribute('aria-label', label+'. Toque para trocar');

const fmtShort = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});

const answeredN = s => s.quiz.filter((q,i)=>ansOf(s)[i]!==undefined).length;
const allAnswered = s => s.quiz.length>0 && answeredN(s)>=s.quiz.length;
const mb = n => (n/1048576).toLocaleString('pt-BR',{maximumFractionDigits: n<1048576*10?1:0}) + ' MB';
const mmss = t => { t=Math.round(t||0); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch{} };
function setPath(obj, path, val){ const k=path.split('.'); for(let i=0;i<k.length-1;i++) obj=obj[k[i]]; obj[k[k.length-1]]=val; }
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function blobToB64(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
function b64ToBlob(b64,type){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
async function imageToDataURL(file){
  try{
    const bmp=await createImageBitmap(file), max=1600, k=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.85);
  }catch{ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); }); }
}
function readMinutes(s){ const w=s.blocks.map(b=>(b.text||'')+' '+(b.cap||'')).join(' ').split(/\s+/).filter(Boolean).length; return Math.max(1, Math.round(w/150)); }
function weekStart(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); }
function streakWeeks(){
  const set=new Set(D.studies.filter(s=>s.done&&s.doneAt).map(s=>weekStart(s.doneAt)));
  let w=weekStart(Date.now()), n=0; if(!set.has(w)) w-=7*864e5;
  while(set.has(w)){ n++; w-=7*864e5; } return n;
}
function studyPct(s){ return allAnswered(s) ? Math.round(scoreOf(s)/s.quiz.length*100) : null; }
function medalOf(s){ const p=studyPct(s); return p===null?'':p>=100?'gold':p>=70?'silver':''; }
function stepsOf(s){
  const auto={leitura:!!s.read, perguntas:allAnswered(s), video:!!s.watched || !s.hasVideo, reflexao:s.done || refOf(s).every(x=>x.trim())};
  const st=s.steps||(s.steps={});
  return [['leitura','Leitura'],['perguntas','Perguntas'],['video','Vídeo'],['reflexao','Reflexão']].map(([id,l])=>({id,l,done: st[id]!==undefined ? st[id] : auto[id]}));
}

/* referências bíblicas → fichas */
const BOOKS='Gênesis|Êxodo|Levítico|Números|Deuteronômio|Josué|Juízes|Rute|1 Samuel|2 Samuel|1 Reis|2 Reis|1 Crônicas|2 Crônicas|Esdras|Neemias|Ester|Jó|Salmos?|Provérbios|Eclesiastes|Cântico de Salomão|Isaías|Jeremias|Lamentações|Ezequiel|Daniel|Oseias|Joel|Amós|Obadias|Jonas|Miqueias|Naum|Habacuque|Sofonias|Ageu|Zacarias|Malaquias|Mateus|Marcos|Lucas|João|Atos|Romanos|1 Coríntios|2 Coríntios|Gálatas|Efésios|Filipenses|Colossenses|1 Tessalonicenses|2 Tessalonicenses|1 Timóteo|2 Timóteo|Tito|Filêmon|Hebreus|Tiago|1 Pedro|2 Pedro|1 João|2 João|3 João|Judas|Apocalipse';
const REF_RE = new RegExp('(^|[^\\wÀ-ú])('+BOOKS+')\\s(\\d{1,3}):(\\d{1,3}(?:(?:-|–|,\\s?)\\d{1,3})*)','g');
const refHTML = html => html.replace(REF_RE, (m,pre,b,c,v)=>{ const r=`${b} ${c}:${v}`; return `${pre}<button type="button" class="ref" data-ref="${esc(r)}">${r}</button>`; });
function refsIn(s){ const set=new Set(); const scan=t=>{ for(const m of String(t||'').matchAll(REF_RE)) set.add(`${m[2]} ${m[3]}:${m[4]}`); }; s.blocks.forEach(b=>{ scan(b.text); scan(b.cite); }); return [...set]; }
const wolLink = ref => 'https://wol.jw.org/pt/wol/s/r5/lp-t?q='+encodeURIComponent(ref);

function pgInicio(){
  const s=cur(), st=stepsOf(s), doneN=st.filter(x=>x.done).length, next=st.find(x=>!x.done), pct=Math.round(doneN/4*100);
  const h=new Date().getHours(), greet = h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const today=new Date(), dateTxt=today.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const remind = D.reminder.on && today.getDay()===D.reminder.day ? `<div class="banner"><span style="flex:1">Hoje é dia de adoração em família.</span></div>` : '';
  const msg = s.done ? 'Concluído e guardado no Baú' : next ? ({leitura:'Comece pela Leitura', perguntas:'Faltam as Perguntas', video:'Falta assistir ao Vídeo', reflexao:'Falta a Reflexão'})[next.id] : 'Tudo pronto para guardar no Baú';
  const btn = s.done ? `<button class="btn wide" data-tab="bau">Ver no Baú de tesouros</button>`
    : next ? `<button class="btn wide" data-tab="${next.id}">${({leitura:'Começar a Leitura', perguntas:'Continuar nas Perguntas', video:'Assistir ao Vídeo', reflexao:'Ir para a Reflexão'})[next.id]}</button>`
    : `<button class="btn wide" data-act="finish">Concluir e guardar no Baú</button>`;
  const ws=weekStart(Date.now()), days=DAYS.map((d,i)=>{ const t0=ws+i*864e5, t1=t0+864e5;
    const y=D.studies.some(x=>x.done&&x.doneAt>=t0&&x.doneAt<t1), t=today.getDay()===i;
    return `<span class="${y?'y':''}${t?' t':''}" title="${DAYN[i]}">${d}</span>`; }).join('');
  const streak=streakWeeks(), doneAll=D.studies.filter(x=>x.done).length, others=D.studies.filter(x=>!x.done && x.id!==s.id);
  return `<p class="greet">${greet}, família<small>${dateTxt.charAt(0).toUpperCase()+dateTxt.slice(1)}</small></p>${remind}
    <div class="cont">${s.cover?`<img src="${s.cover}" alt="">`:`<span class="cov"></span>`}<div class="tt"><b>${esc(s.title)}</b><small>${msg}</small></div><div class="ring" style="--p:${s.done?100:pct}" data-l="${s.done?100:pct}%"></div></div>
    <div class="steps">${st.map((x,i)=>`<div class="${x.done?'done':(next&&next.id===x.id?'now':'')}"><button type="button" class="chkstep" data-act="step" data-id="${x.id}" aria-pressed="${x.done}" aria-label="${x.done?'Desmarcar':'Marcar'} ${x.l}"><i>${x.done?'✓':i+1}</i></button><button type="button" class="golbl" data-tab="${x.id}">${x.l}</button></div>`).join('')}</div>
    <p class="hint" style="text-align:center;margin:0 0 10px">Toque no círculo para marcar ou desmarcar uma etapa.</p>
    ${btn}
    <div class="card" style="margin-top:14px"><div class="streak"><b>${streak}</b><div><span>${streak===1?'semana seguida':'semanas seguidas'}</span><small>${D.reminder.on?`Adoração em família toda ${DAYN[D.reminder.day]}`:'Conclua um estudo por semana para manter a sequência'}</small></div></div><div class="week">${days}</div></div>
    <div class="card"><div class="streak"><b>${doneAll}</b><div><span>${doneAll===1?'tesouro no Baú':'tesouros no Baú'}</span><small>${doneAll?'Toque em Baú para rever os estudos concluídos':'O primeiro chega quando vocês concluírem um estudo'}</small></div></div></div>
    ${others.length?`<p class="sec-t">Outros estudos em andamento</p>${others.map(x=>trow(x)).join('')}`:''}`;
}

function pgLeitura(){
  const s=cur(), ed=E();
  const plus = i => ed ? `<div class="plus"><button type="button" data-act="plus" data-i="${i}" aria-label="Adicionar bloco aqui">+</button></div>` : '';
  const txt = (html) => ed ? html : refHTML(html);
  const blocks=s.blocks.map((b,i)=>{
    const tools = ed ? `<span class="grip" data-grip="${i}" aria-hidden="true"></span><div class="blk-tools"><button class="ic" data-act="up" data-i="${i}" aria-label="Subir bloco">↑</button><button class="ic" data-act="down" data-i="${i}" aria-label="Descer bloco">↓</button><button class="ic del" data-act="del" data-i="${i}" aria-label="Excluir bloco">✕</button></div>` : '';
    let inner='';
    if(b.t==='p') inner=`<p class="blk-p"${ce('blocks.'+i+'.text')} data-paste="${i}">${txt(escBr(b.text))}</p>`;
    if(b.t==='h') inner=`<h3 class="blk-h"${ce('blocks.'+i+'.text')}>${escBr(b.text)}</h3>`;
    if(b.t==='q') inner=`<blockquote class="blk-q"><span${ce('blocks.'+i+'.text')}>${escBr(b.text)}</span><cite${ce('blocks.'+i+'.cite')}>${txt(esc(b.cite))}</cite></blockquote>`;
    if(b.t==='img') inner=`<figure class="blk-img">${b.src?`<img src="${b.src}" alt="${esc(b.cap)}">`:''}
      ${ed?`<label class="upl">${b.src?'Trocar imagem':'Escolher imagem'}<input type="file" accept="image/*" data-img="blocks.${i}.src"></label>`:''}
      <figcaption${ce('blocks.'+i+'.cap')}>${escBr(b.cap)}</figcaption></figure>`;
    return `${plus(i)}<div class="blk" data-blk="${i}">${tools}${inner}</div>`;
  }).join('') + plus(s.blocks.length);
  const refs = refsIn(s);
  const versesEd = ed ? `<p class="sec-t">Versículos citados</p><div class="card">${refs.length?`<p class="hint">Cole o texto de cada versículo. No modo leitor, tocar na referência mostra esse texto.</p>${refs.map(r=>`<label class="field">${esc(r)}<textarea data-verse="${esc(r)}" placeholder="Cole aqui o texto do versículo">${esc(s.verses[r]||'')}</textarea></label>`).join('')}`:`<p class="hint" style="margin:0">Escreva referências como “Rute 1:16” no texto e elas aparecem aqui.</p>`}</div>` : '';
  const tools = ed ? '' : `<div class="rtools"><button type="button" data-act="fs" data-d="-1" aria-label="Diminuir letra">A–</button><button type="button" data-act="fs" data-d="1" aria-label="Aumentar letra">A+</button><button type="button" data-act="serif" class="${UI.serif?'on':''}" aria-pressed="${UI.serif}">Serifa</button></div>`;
  const end = ed ? '' : `<div class="readend" id="readEnd"><span class="pill">${s.read?'Leitura concluída':'Fim da leitura'}</span><div style="margin-top:12px"><button class="btn ghost" data-tab="perguntas">Ir para as Perguntas →</button></div></div>`;
  return `${tools}<section class="cover">
    ${s.cover?`<img src="${s.cover}" alt="Capa do estudo">`:`<div class="noimg">${ed?'':'Sem capa'}</div>`}
    ${ed?`<label class="upl">${s.cover?'Trocar capa':'Escolher capa'}<input type="file" accept="image/*" data-img="cover"></label>`:''}
    <div class="cv-txt"><p class="kicker"${ce('kicker')}>${esc(s.kicker)}</p><h2${ce('title')}>${escBr(s.title)}</h2><p class="sub"${ce('sub')}>${escBr(s.sub)}</p>
    <p class="rt">${readMinutes(s)} min de leitura${s.done && !ed?` · <span class="pill">Guardado no Baú em ${fmt(s.doneAt)}</span>`:''}</p></div>
  </section><article class="article${UI.serif&&!ed?' serif':''}" style="--fs:${ed?1:UI.fs}">${blocks}${end}</article>${versesEd}`;

function pgPerguntas(){
  const s=cur(); let html;
  if(E()){
    html=s.quiz.map((q,qi)=>`<div class="card">
      <div class="blk-tools" style="justify-content:space-between;align-items:center"><span class="qn" style="margin:0">Pergunta ${qi+1}</span><button class="ic del" data-act="delq" data-i="${qi}" aria-label="Excluir pergunta">✕</button></div>
      <p class="qt" style="margin-top:10px"${ce('quiz.'+qi+'.q')}>${escBr(q.q)}</p><p class="hint">Toque no círculo para marcar a resposta certa.</p>
      ${q.o.map((o,oi)=>`<div class="opt-edit${q.c===oi?' is-right':''}"><input type="radio" name="c${qi}" ${q.c===oi?'checked':''} data-correct="${qi}" value="${oi}" aria-label="Marcar alternativa ${oi+1} como correta"><span class="otxt"${ce('quiz.'+qi+'.o.'+oi)}>${esc(o)}</span>${q.o.length>2?`<button class="ic del" data-act="delo" data-i="${qi}" data-o="${oi}" aria-label="Remover alternativa">✕</button>`:''}</div>`).join('')}
      ${q.o.length<6?`<button class="btn ghost tiny" data-act="addo" data-i="${qi}">+ Alternativa</button>`:''}
      <label class="field" style="margin-top:14px">Explicação (aparece depois de responder)<textarea data-input="quiz.${qi}.why" placeholder="Ex.: Belém, porque a fome tinha acabado ali (Rute 1:6).">${esc(q.why)}</textarea></label></div>`).join('')
      + `<button class="btn wide" data-act="addq">+ Nova pergunta</button>`;
    return `<h1 class="ptitle">Perguntas</h1>${html}`;
  }
  if(!s.quiz.length) return `<h1 class="ptitle">Perguntas</h1>${chestEmpty('Sem perguntas ainda','Este estudo não tem perguntas. Ligue o modo editor para criar.')}`;
  const A=ansOf(s), n=s.quiz.length;
  if(UI.qi===null || UI.qiFor!==s.id){ const f=s.quiz.findIndex((q,i)=>A[i]===undefined); UI.qi = f<0 ? n : f; UI.qiFor=s.id; }
  const qi=UI.qi;
  const prog=`<div class="qprog" aria-label="Progresso">${s.quiz.map((q,k)=>`<button type="button" class="${A[k]===undefined?(k===qi?'d':''):A[k]===q.c?'r':'w'}" data-act="goq" data-i="${k}" aria-label="Pergunta ${k+1}"></button>`).join('')}</div>`;
  if(qi>=n){
    const right=scoreOf(s), wrong=n-right, all=allAnswered(s);
    html = all
      ? `<div class="score" id="score"><b>${right} de ${n}</b>respostas certas
          <div class="row2">${wrong&&!s.done?`<button class="btn tiny" data-act="redo">Refazer só as ${wrong===1?'que errei':wrong+' que errei'}</button>`:''}${!s.done?`<button class="btn ghost tiny" data-act="reset">Responder de novo</button>`:''}<button class="btn ghost tiny" data-tab="video">Ir para o Vídeo</button></div></div>`
      : `<div class="score" style="background:var(--soft);color:var(--acc-ink)">Respondidas: ${answeredN(s)} de ${n}<div class="row2"><button class="btn tiny" data-act="goq" data-i="${s.quiz.findIndex((q,i)=>A[i]===undefined)}">Continuar</button></div></div>`;
  } else {
    const q=s.quiz[qi], a=A[qi];
    html=`<div class="card qcard" key="${qi}"><span class="qn">${qi+1} de ${n}</span><p class="qt">${escBr(q.q)}</p>
      ${q.o.map((o,oi)=>{ let cls=''; if(a!==undefined) cls = oi===q.c?'right':oi===a?'wrong':'dim';
        const mark = cls==='right'?'✓':cls==='wrong'?'✕':String.fromCharCode(65+oi);
        return `<button class="opt ${cls}" data-act="ans" data-i="${qi}" data-o="${oi}" ${a!==undefined?'disabled':''}><span class="dot">${mark}</span>${esc(o)}</button>`; }).join('')}

function updateRbar(){ const b=document.getElementById('rbar'); if(!b.classList.contains('on')) return; const m=document.documentElement.scrollHeight-window.innerHeight; b.firstElementChild.style.width=(m>0?Math.min(100,window.scrollY/m*100):100)+'%'; }

function wireVideo(v){
  const s=cur(); let last=0;
  v.addEventListener('loadedmetadata',()=>{ if(isFinite(v.duration) && Math.round(v.duration)!==Math.round(s.vdur||0)){ s.vdur=v.duration; save(); } if(s.vpos>5 && !s.watched && s.vpos<v.duration-3) v.currentTime=s.vpos; });
  v.addEventListener('timeupdate',()=>{ if(v.currentTime-last>5 || v.currentTime<last){ last=v.currentTime; s.vpos=v.currentTime; save(); }
    if(!s.watched && v.duration && v.currentTime/v.duration>.9){ s.watched=true; delete s.steps.video; save(); toast('Vídeo assistido.'); } });
  v.addEventListener('ended',()=>{ if(!s.watched){ s.watched=true; } s.vpos=0; save(); });
}

/* =============== gravação de áudio =============== */
async function recStart(pid,i){
  const s=cur();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const type=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t))||'';
    const mr=new MediaRecorder(stream, type?{mimeType:type}:undefined), chunks=[], t0=Date.now();
    mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop()); clearInterval(UI.rec.timer);
      const dur=(Date.now()-t0)/1000, blob=new Blob(chunks,{type:mr.mimeType||type||'audio/webm'}), key=audKey(s,pid,i);
      UI.rec=null;
      if(dur<1){ toast('Gravação muito curta.'); render(); return; }
      try{ await IDB.put('videos', key, {blob, name:'audio', dur}); dropURL(key); vurl[key]=URL.createObjectURL(blob); s.audios[`${pid}.${i}`]={dur}; save(); askPersistent(); render(); toast('Áudio guardado no aparelho.'); }
      catch{ toast('Não foi possível guardar o áudio.'); render(); }
    };
    mr.start(250);
    UI.rec={key:audKey(s,pid,i), mr, timer:setInterval(()=>{ const el=document.querySelector('[data-rectime]'); if(el) el.textContent=mmss((Date.now()-t0)/1000); },500)};
    render();
  }catch{ toast('Não foi possível usar o microfone.'); }
}
function recStop(){ if(UI.rec && UI.rec.mr.state!=='inactive') UI.rec.mr.stop(); }

function wrapText(x, text, maxW){ const words=text.split(' '), lines=[]; let line=''; for(const w of words){ const t=line?line+' '+w:w; if(x.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; } if(line) lines.push(line); return lines; }
async function shareCard(s){
  const W=1080,H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#F3F0EC'; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(193,86,26,.08)'; x.lineWidth=2; for(let i=-H;i<W+H;i+=14){ x.beginPath(); x.moveTo(i,0); x.lineTo(i+H,H); x.stroke(); }
  const rr=(px,py,w,h,r)=>{ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); };
  x.fillStyle='#fff'; rr(60,60,960,1230,48); x.fill();
  if(s.cover){ try{ const im=new Image(); im.src=s.cover; await im.decode(); x.save(); rr(84,84,912,700,36); x.clip(); const k=Math.max(912/im.width,700/im.height), w=im.width*k,h=im.height*k; x.drawImage(im,84+(912-w)/2,84+(700-h)/2,w,h); x.restore(); }catch{} }
  else { x.fillStyle='#FBE7DA'; rr(84,84,912,700,36); x.fill(); }
  let y=850;
  x.fillStyle='#C1561A'; x.font='800 30px "Baloo 2", Nunito, sans-serif'; const kw=x.measureText(s.kicker).width+44; rr(84,y-36,kw,54,27); x.fill(); x.fillStyle='#fff'; x.fillText(s.kicker,106,y+2); y+=76;
  x.fillStyle='#2B221D'; x.font='800 68px "Baloo 2", Nunito, sans-serif'; for(const l of wrapText(x,s.title,912).slice(0,3)){ x.fillText(l,84,y); y+=74; }
  y+=14; x.fillStyle='#7B6B61'; x.font='700 32px Nunito, sans-serif';
  const sc=allAnswered(s)?`${scoreOf(s)} de ${s.quiz.length} certas`:'';
  x.fillText(`Concluído em ${fmt(s.doneAt)}${sc?'   ·   '+sc:''}`,84,y); y+=56;
  const m=medalOf(s); if(m){ x.fillStyle=m==='gold'?'#E0A43A':'#C9C3BC'; x.beginPath(); x.arc(108,y+4,26,0,7); x.fill(); x.fillStyle='#5A3A00'; x.font='800 30px Nunito, sans-serif'; x.fillText('★',94,y+15); x.fillStyle='#2B221D'; x.font='800 32px Nunito, sans-serif'; x.fillText(m==='gold'?'Todas as respostas certas':'Mais de 70% de acertos',150,y+15); }
  x.fillStyle='#A94A16'; x.font='800 30px "Baloo 2", Nunito, sans-serif'; x.fillText('Alan & Átina · Nossa adoração em família',84,1240);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const name='tesouro-'+s.title.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)+'.png';
  try{ const file=new File([blob],name,{type:'image/png'}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:s.title}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  offerFile(name, blob);
}

function icsFile(){
  const r=D.reminder, d=new Date(); d.setHours(r.hour,0,0,0); while(d.getDay()!==r.day || d<Date.now()) d.setDate(d.getDate()+1);
  const p=n=>String(n).padStart(2,'0'), st=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}0000`;
  const by=['SU','MO','TU','WE','TH','FR','SA'][r.day];
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Alan & Atina//PT','BEGIN:VEVENT',`UID:aa-adoracao-${r.day}@alan-atina`,`DTSTAMP:${st}`,`DTSTART:${st}`,'DURATION:PT1H',`RRULE:FREQ=WEEKLY;BYDAY=${by}`,'SUMMARY:Adoração em família','DESCRIPTION:Abrir o app Alan & Átina','BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Adoração em família','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  offerFile('adoracao-em-familia.ics', new Blob([ics],{type:'text/calendar'}));
}
async function checkReminder(){
  const r=D.reminder; if(!r.on || !('Notification' in window) || Notification.permission!=='granted') return;
  const now=new Date(); if(now.getDay()!==r.day || now.getHours()<r.hour) return;
  const key=now.toDateString(); try{ if(localStorage.getItem('aa-remind')===key) return; localStorage.setItem('aa-remind',key); }catch{}
  const opts={body:'Hoje é dia de adoração em família. O estudo está pronto no app.', icon:'icon-192.png', tag:'aa-remind'};
  try{ const reg=await navigator.serviceWorker?.getRegistration(); if(reg && reg.showNotification) await reg.showNotification('Alan & Átina', opts); else new Notification('Alan & Átina', opts); }catch{}
}

/* =============== eventos =============== */
document.getElementById('themeBtn').addEventListener('click',()=>{
  UI.theme = {auto:'light', light:'dark', dark:'auto'}[UI.theme]; saveUI(); applyTheme(); toast(document.getElementById('themeBtn').title);
});
document.getElementById('editBtn').addEventListener('click',()=>{
  UI.mode = E() ? 'leitor' : 'editor'; UI.delArm=null; UI.sheet=null; saveUI(); render(); toast(E()?'Modo editor ligado':'Modo leitor');
});
document.addEventListener('input',e=>{
  const b=e.target.closest('[data-bind]');
  if(b){ setPath(cur(), b.dataset.bind, b.innerText.replace(/\n$/,'')); save(); }
  const v=e.target.closest('[data-verse]');
  if(v){ cur().verses[v.dataset.verse]=v.value; save(); }
  const f=e.target.closest('[data-input]');
  if(f){ const p=f.dataset.input;
    if(p.startsWith('profiles.') || p.startsWith('reminder.')) setPath(D, p, f.type==='number'?Math.min(23,Math.max(0,+f.value||0)):f.value); else setPath(cur(), p, f.value);
    save();
    if(p==='person') document.querySelectorAll('[data-person]').forEach(x=>x.textContent=f.value||'—');
    else if(p.startsWith('reflex.')){ const s=f.parentElement.querySelector('.saved'); if(s) s.textContent=f.value?`Resposta de ${prof(UI.who).name} · salva neste aparelho`:`Resposta de ${prof(UI.who).name} · fica só neste aparelho`; } }
});
/* colar vários parágrafos vira vários blocos */
document.addEventListener('paste',e=>{
  const p=e.target.closest('[data-paste]'); if(!p || !E()) return;
  const text=(e.clipboardData||window.clipboardData)?.getData('text/plain'); if(!text) return;
  const parts=text.split(/\n\s*\n|\r?\n/).map(x=>x.trim()).filter(Boolean); if(parts.length<2) return;
  e.preventDefault(); const s=cur(), i=+p.dataset.paste, cur0=s.blocks[i];
  cur0.text = (cur0.text && cur0.text!=='Escreva aqui o primeiro parágrafo.' && cur0.text!=='Escreva aqui o novo parágrafo.' ? cur0.text+'\n' : '') + parts[0];
  s.blocks.splice(i+1,0,...parts.slice(1).map(t=>({t:'p',text:t}))); save(); render(); toast(`${parts.length} parágrafos colados.`);
});
document.addEventListener('change', async e=>{
  const t=e.target, s=cur();
  if(t.dataset.img!==undefined && t.files[0]){ setPath(s, t.dataset.img, await imageToDataURL(t.files[0])); save(); render(); }
  if(t.dataset.video!==undefined && t.files[0]){
    const file=t.files[0];
    if(!idbOK){ toast('Este navegador não permite guardar vídeos no aparelho.'); return; }
    toast('Guardando o vídeo…');
    try{ await IDB.put('videos', s.id, {blob:file, name:file.name}); dropURL(s.id); vurl[s.id]=URL.createObjectURL(file);
         s.hasVideo=true; s.vname=file.name; s.vsize=file.size; s.vdur=0; s.vpos=0; s.watched=false; save(); askPersistent(); render(); toast('Vídeo guardado no aparelho.'); }
    catch{ toast('O vídeo não coube no armazenamento do aparelho. Tente um arquivo menor.'); }
  }
  if(t.dataset.correct!==undefined){ s.quiz[+t.dataset.correct].c=+t.value; s.answers={}; save(); render(); }
  if(t.dataset.withvideos!==undefined){ UI.withVideos=t.checked; saveUI(); }
  if(t.dataset.restore!==undefined && t.files[0]){
    try{ const j=JSON.parse(await t.files[0].text());
      if(j.app!==APP_ID || !j.data || !Array.isArray(j.data.studies) || !j.data.studies.length) throw 0;
      UI.pendingRestore=j; render(); window.scrollTo(0, document.body.scrollHeight);
    }catch{ toast('Esse arquivo não é um backup do Alan & Átina.'); }
    t.value='';
  }
});
async function doBackup(){
  toast('Montando o backup…');
  const now=Date.now(), out={app:APP_ID, version:2, exportedAt:now, data:{...D, lastBackup:now}, videos:{}};
  if(UI.withVideos && idbOK){
    for(const s of D.studies){ for(const key of mediaKeys(s)){
      try{ const v=await IDB.get('videos',key); if(v) out.videos[key]={name:v.name, type:v.blob.type||'application/octet-stream', dur:v.dur, data:await blobToB64(v.blob)}; }catch{} } }
  }
  const d=new Date(), name=`alan-atina-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  if(await offerFile(name, new Blob([JSON.stringify(out)],{type:'application/json'}))){ D.lastBackup=now; save(); render(); toast('Backup pronto.'); }
}
async function doRestore(){
  const j=UI.pendingRestore; UI.pendingRestore=null;
  const vids=j.videos||{};
  toast('Restaurando…');
  try{
    if(idbOK && Object.keys(vids).length){
      await IDB.clear('videos');
      for(const [id,v] of Object.entries(vids)) await IDB.put('videos', id, {blob:b64ToBlob(v.data, v.type), name:v.name, dur:v.dur});
    }
    Object.keys(vurl).forEach(dropURL);
    D=migrate(j.data); if(!D.studies.find(s=>s.id===D.currentId)) D.currentId=D.studies[0].id;
    UI.qi=null; await persist(); await loadStudyMedia(cur()); render(); toast('Backup restaurado.');
  }catch{ toast('Não foi possível restaurar. O aparelho pode estar sem espaço.'); render(); }
}
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.trow,.tcard')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Escape' && UI.sheet){ UI.sheet=null; render(); }
});
document.addEventListener('click', async e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){ go(tb.dataset.tab); return; }
  const a=e.target.closest('[data-act]'); if(!a || a.disabled) return;
  const s=cur(), B=s.blocks, i=+a.dataset.i, o=+a.dataset.o, act=a.dataset.act;
  if(act==='delstudy'){ e.stopPropagation();
    if(UI.delArm!==a.dataset.id){ UI.delArm=a.dataset.id; render(); return; }
    const id=a.dataset.id, victim=D.studies.find(x=>x.id===id); D.studies=D.studies.filter(x=>x.id!==id); UI.delArm=null;
    if(victim){ for(const k of mediaKeys(victim)){ if(idbOK) IDB.del('videos',k).catch(()=>{}); dropURL(k); } }
    if(!D.studies.length){ const n=blankStudy(); D.studies=[n]; D.currentId=n.id; }
    else if(D.currentId===id) D.currentId=D.studies[0].id;
    UI.qi=null; await loadStudyMedia(cur()); save(); render(); toast('Estudo excluído.'); return;
  }
  if(act==='open' || act==='share' || act==='flip'){ if(a.closest('.tcard') && act!=='flip') e.stopPropagation(); }
  switch(act){
    case 'sheet-close': UI.sheet=null; render(); break;
    case 'step': { const stp=stepsOf(s).find(x=>x.id===a.dataset.id); s.steps[a.dataset.id]=!stp.done; save(); buzz(10); render(); break; }
    case 'ref': break;
    case 'plus': UI.sheet={type:'add', pos:i}; render(); break;
    case 'add': { const t=a.dataset.t, pos=a.dataset.pos!==undefined?+a.dataset.pos:B.length;
      B.splice(pos,0, t==='img'?{t,src:'',cap:'Legenda da imagem'}:t==='q'?{t,text:'Texto em destaque',cite:'Referência'}:t==='h'?{t,text:'Novo título'}:{t,text:'Escreva aqui o novo parágrafo.'});
      UI.sheet=null; save(); render(); const el=document.querySelector(`[data-blk="${pos}"]`); if(el){ el.scrollIntoView({block:'center'}); const ed=el.querySelector('[contenteditable]'); if(ed) ed.focus(); } break; }
    case 'del': B.splice(i,1); save(); render(); break;
    case 'up': if(i>0){[B[i-1],B[i]]=[B[i],B[i-1]]; save(); render();} break;
    case 'down': if(i<B.length-1){[B[i+1],B[i]]=[B[i],B[i+1]]; save(); render();} break;
    case 'fs': UI.fs=Math.round(Math.min(1.4,Math.max(.85,UI.fs+(+a.dataset.d)*.1))*100)/100; saveUI(); document.querySelector('.article').style.setProperty('--fs',UI.fs); break;
    case 'serif': UI.serif=!UI.serif; saveUI(); document.querySelector('.article').classList.toggle('serif',UI.serif); a.classList.toggle('on',UI.serif); a.setAttribute('aria-pressed',UI.serif); break;
    case 'who': UI.who=a.dataset.id; saveUI(); render(); break;
    case 'addq': s.quiz.push({q:'Nova pergunta',o:['Alternativa A','Alternativa B','Alternativa C'],c:0,why:''}); s.answers={}; save(); render(); window.scrollTo(0,document.body.scrollHeight); break;
    case 'delq': s.quiz.splice(i,1); s.answers={}; save(); render(); break;
    case 'addo': s.quiz[i].o.push('Nova alternativa'); save(); render(); break;
    case 'delo': { const q=s.quiz[i]; q.o.splice(o,1); if(q.c===o) q.c=0; else if(q.c>o) q.c--; s.answers={}; save(); render(); break; }
    case 'ans': { ansOf(s)[i]=o; if(allAnswered(s)) delete s.steps.perguntas; save(); if(o===s.quiz[i].c) buzz(15); render(); break; }
    case 'nextq': { const A=ansOf(s), n=s.quiz.length; let j=UI.qi+1; while(j<n && A[j]!==undefined) j++; if(j>=n){ const f=s.quiz.findIndex((q,k)=>A[k]===undefined); j = f<0 ? n : f; } UI.qi=j; render();
      if(j>=n && allAnswered(s)){ buzz([20,40,20]); const sc=document.getElementById('score'); if(sc){ for(let k=0;k<28;k++){ const c=document.createElement('i'); c.className='conf'; c.style.left=(Math.random()*100)+'%'; c.style.background=['#FFF3C4','#E0A43A','#FBE7DA','#fff'][k%4]; c.style.animationDelay=(Math.random()*.7)+'s'; sc.appendChild(c); } } }
      break; }
    case 'goq': UI.qi=i; render(); break;
    case 'redo': { const A=ansOf(s); s.quiz.forEach((q,k)=>{ if(A[k]!==q.c) delete A[k]; }); UI.qi=null; save(); render(); break; }
    case 'reset': s.answers={}; UI.qi=null; save(); render(); break;
    case 'rmvideo': if(idbOK) await IDB.del('videos',s.id).catch(()=>{}); dropURL(s.id); vurl[s.id]=null; s.hasVideo=false; s.vname=''; s.vsize=0; s.vdur=0; s.vpos=0; s.watched=false; save(); render(); break;
    case 'recstart': recStart(a.dataset.pid, i); break;
    case 'recstop': recStop(); break;
    case 'recdel': { const key=audKey(s,a.dataset.pid,i); if(idbOK) await IDB.del('videos',key).catch(()=>{}); dropURL(key); delete s.audios[`${a.dataset.pid}.${i}`]; save(); render(); break; }
    case 'finish': s.done=true; s.doneAt=Date.now(); s.steps={}; save(); buzz([20,40,20]); render(); toast('Guardado no Baú de tesouros.'); break;
    case 'reopen': s.done=false; s.doneAt=null; save(); render(); break;
    case 'open': D.currentId=a.dataset.id; UI.delArm=null; UI.qi=null; UI.flip=null; await loadStudyMedia(cur()); save(); go('leitura'); break;
    case 'flip': UI.flip = UI.flip===a.dataset.id ? null : a.dataset.id; document.querySelectorAll('.tcard').forEach(c=>c.classList.toggle('flip', c.dataset.id===UI.flip)); break;
    case 'share': shareCard(D.studies.find(x=>x.id===a.dataset.id)); break;
    case 'newstudy': UI.sheet={type:'tpl'}; render(); break;
    case 'tpl': { const n=TEMPLATES[a.dataset.t].make(); D.studies.unshift(n); D.currentId=n.id; UI.sheet=null; UI.qi=null; save(); go('leitura'); toast('Novo estudo criado.'); break; }
    case 'remind': { D.reminder.on=!D.reminder.on; save(); render();
      if(D.reminder.on && 'Notification' in window && Notification.permission==='default'){ try{ await Notification.requestPermission(); }catch{} render(); }
      break; }
    case 'remday': D.reminder.day=i; save(); render(); break;
    case 'ics': icsFile(); break;
    case 'update': location.reload(); break;
    case 'backup': doBackup(); break;
    case 'restore-ok': doRestore(); break;
    case 'restore-no': UI.pendingRestore=null; render(); break;
  }
});
/* referências: abrir a folha (fora do switch para não disparar em modo editor) */
document.addEventListener('click',e=>{ const r=e.target.closest('.ref[data-ref]'); if(r && !E()){ UI.sheet={type:'ref', ref:r.dataset.ref}; render(); } });

/* arrastar blocos pela alça */
(function(){
  let drag=null;
  const clear=()=>drag&&drag.els.forEach(el=>el.classList.remove('dragging','drop-before','drop-after'));
  document.addEventListener('pointerdown',e=>{
    const g=e.target.closest('[data-grip]'); if(!g) return;
    e.preventDefault(); const from=+g.dataset.grip;
    drag={from, dest:from, els:[...document.querySelectorAll('.article .blk')]};
    drag.els[from].classList.add('dragging');
    try{ g.setPointerCapture(e.pointerId); }catch{}
  });
  document.addEventListener('pointermove',e=>{
    if(!drag) return; e.preventDefault();
    let dest=0; drag.els.forEach((el,k)=>{ const r=el.getBoundingClientRect(); if(e.clientY>r.top+r.height/2) dest=k+1; });
    drag.dest=dest; drag.els.forEach(el=>el.classList.remove('drop-before','drop-after'));
    if(dest!==drag.from && dest!==drag.from+1){ if(dest<drag.els.length) drag.els[dest].classList.add('drop-before'); else drag.els[drag.els.length-1].classList.add('drop-after'); }
    if(e.clientY<90) window.scrollBy(0,-8); else if(e.clientY>window.innerHeight-120) window.scrollBy(0,8);
  });
  document.addEventListener('pointerup',()=>{
    if(!drag) return; const {from}=drag; let d=drag.dest; clear(); drag=null;
    if(d===from || d===from+1) return;
    const B=cur().blocks, [b]=B.splice(from,1); if(d>from) d--; B.splice(d,0,b); save(); render();
  });
  document.addEventListener('pointercancel',()=>{ clear(); drag=null; });
})();

/* =============== início =============== */
(async()=>{
  try{ const u=JSON.parse(localStorage.getItem('aa-ui')||'{}');
    if(u.mode) UI.mode=u.mode; if(['auto','light','dark'].includes(u.theme)) UI.theme=u.theme; if(typeof u.withVideos==='boolean') UI.withVideos=u.withVideos;
    if(typeof u.fs==='number') UI.fs=u.fs; if(typeof u.serif==='boolean') UI.serif=u.serif; if(u.who) UI.who=u.who; }catch{}
  applyTheme();
  try{ if(!window.indexedDB) throw 0; await IDB.open(); idbOK=true; }catch{ idbOK=false; }
  let saved=null;
  try{ saved = idbOK ? await IDB.get('kv','db') : JSON.parse(localStorage.getItem('aa-db')||'null'); }catch{}
  D = (saved && Array.isArray(saved.studies) && saved.studies.length) ? migrate(saved) : seed();
  if(!D.profiles.find(p=>p.id===UI.who)) UI.who=D.profiles[0].id;
  if(!saved) persist();
  const t=location.hash.slice(1); TAB=PG[t]?t:'inicio';
  await loadStudyMedia(cur());
  render();
  checkReminder();
  if('serviceWorker' in navigator && location.protocol.startsWith('http') && window.top===window.self){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller){ UI.update=true; render(); } }); });
    }).catch(()=>{});
  }
})();
